<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Student ERP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

:root{
    --coral:#ff7f73;
    --orange:#ff9d77;
    --peach:#ffb879;
    --yellow:#ffd36f;
    --dark:#303030;
    --text:#555;
    --black:#222;
    --muted:#777;
    --cream:#fffaf0;
    --page:#fafafa;

    --gradient:
        linear-gradient(
            100deg,
            #ff7f73 0%,
            #ffad79 48%,
            #ffd36f 100%
        );

    --shadow:
        0 3px 9px rgba(0,0,0,.11);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
    background:var(--page);
    color:var(--text);
    font-family:'Poppins',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button,
input,
textarea,
select{
    outline:none;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    padding-bottom:82px;
    overflow-x:hidden;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:64px;
    width:100%;
    background:#fff;

    display:grid;
    grid-template-columns:50px minmax(0,1fr) 50px;
    align-items:center;

    padding:0 10px;

    position:sticky;
    top:0;
    z-index:50;

    box-shadow:0 2px 7px rgba(0,0,0,.13);
}

.topbar-title{
    min-width:0;
    text-align:center;

    color:#222;
    font-size:23px;
    font-weight:400;

    white-space:nowrap;
}

.topbar-btn{
    width:44px;
    height:44px;

    border:0;
    background:transparent;

    display:grid;
    place-items:center;

    color:#444;

    position:relative;
}

.icon{
    width:25px;
    height:25px;

    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.notification-badge{
    position:absolute;

    right:0;
    top:1px;

    min-width:27px;
    height:27px;

    padding:0 5px;

    border-radius:9px;

    background:var(--gradient);

    display:grid;
    place-items:center;

    color:#222;
    font-size:12px;
    font-weight:400;
}

/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content{
    width:100%;
    max-width:1000px;

    margin:0 auto;

    padding:25px 24px 30px;

    overflow-x:hidden;
}

.section-title{
    margin:0 0 17px;

    color:#111;

    font-size:25px;
    line-height:1.25;
    font-weight:400;
}

/* =====================================================
   TIMETABLE
===================================================== */

.timetable-section{
    width:100%;
    margin-bottom:35px;
}

.timetable-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    margin-bottom:17px;
}

.timetable-header .section-title{
    margin-bottom:0;
}

.dost-btn{
    flex:0 0 auto;

    border:0;

    padding:9px 18px;

    border-radius:20px;

    background:var(--gradient);

    color:#222;

    font-size:14px;
    font-weight:500;

    white-space:nowrap;

    box-shadow:0 3px 7px rgba(0,0,0,.13);
}

.timetable-scroll{
    width:100%;

    display:flex;
    gap:16px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:3px 2px 12px;

    scrollbar-width:none;
}

.timetable-scroll::-webkit-scrollbar{
    display:none;
}

.timetable-card{
    flex:0 0 min(305px,82vw);

    height:212px;

    position:relative;

    overflow:hidden;

    border-radius:11px;

    background:var(--gradient);

    box-shadow:var(--shadow);

    padding:25px 23px;
}

.course-code{
    color:#222;

    font-size:24px;
    font-weight:600;
    line-height:1.2;
}

.room{
    margin-top:7px;

    color:#333;

    font-size:15px;
    font-weight:400;
}

.status-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;

    margin-top:17px;

    padding:6px 12px;

    border-radius:18px;

    background:#ffd078;

    color:#444;

    font-size:13px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ed7e20;
}

.time-strip{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#303030;

    color:#fff;

    font-size:17px;
    font-weight:500;
}

/* decorative book-like lines */
.timetable-card::after{
    content:"";

    position:absolute;

    width:110px;
    height:70px;

    right:-15px;
    bottom:37px;

    border:3px solid rgba(255,255,255,.23);
    border-radius:50%;

    transform:rotate(-15deg);
}

/* =====================================================
   TILES HEADER
===================================================== */

.tiles-heading{
    margin-bottom:19px;
}

.tiles-heading h2{
    color:#111;

    font-size:24px;
    line-height:1.3;
    font-weight:400;
}

.tiles-heading p{
    margin-top:6px;

    color:#222;

    font-size:13px;
    line-height:1.4;
    font-weight:400;
}

/* =====================================================
   TILE GRID
===================================================== */

.tile-grid{
    width:100%;

    display:grid;

    /*
       VERY IMPORTANT:
       minmax(0,1fr) prevents the cards from
       pushing the third column outside viewport.
    */
    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:17px 13px;

    overflow:visible;
}

.tile{
    min-width:0;
    width:100%;

    min-height:218px;

    position:relative;

    background:var(--cream);

    border:1px solid #e8e0d1;
    border-radius:12px;

    box-shadow:
        0 3px 7px rgba(0,0,0,.08);

    padding:28px 7px 13px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    overflow:visible;
}

.tile.selected{
    border-color:var(--coral);
    box-shadow:0 0 0 1px var(--coral),0 3px 7px rgba(0,0,0,.08);
}

.tile-icon{
    width:58px;
    height:58px;

    flex:0 0 auto;

    margin-bottom:16px;

    color:#333;

    display:grid;
    place-items:center;
}

.tile-icon .icon{
    width:100%;
    height:100%;

    stroke-width:1.55;
}

.tile-label{
    width:100%;
    min-width:0;
    max-width:100%;

    border:0;

    background:#ffbd7b;

    border-radius:8px;

    padding:7px 4px;

    color:#222;

    font-size:12px;
    line-height:1.25;
    font-weight:400;

    text-align:center;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
}

.tile-badge,
.tile-remove{
    position:absolute;

    right:-1px;
    top:-15px;

    min-width:39px;
    height:39px;

    padding:0 6px;

    border-radius:9px;

    background:var(--gradient);

    display:grid;
    place-items:center;

    color:#222;

    font-size:12px;
    font-weight:400;

    z-index:3;
}

.tile-remove{
    border:0;

    font-size:19px;
}

.add-tiles{
    margin-bottom:20px;
}

.add-tile-menu{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.add-chip{
    border:1px solid #ddd;

    background:#fff;

    border-radius:20px;

    padding:7px 11px;

    color:#555;

    font-size:12px;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;

    height:74px;

    background:#fff;

    border-top:1px solid #e7e7e7;

    box-shadow:
        0 -2px 8px rgba(0,0,0,.07);

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    z-index:90;

    padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
    min-width:0;

    border:0;

    background:transparent;

    color:#777;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:12px;
    font-weight:400;

    overflow:hidden;
}

.nav-item .icon{
    width:27px;
    height:27px;
}

.nav-item span{
    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:100%;
}

.nav-item.active{
    color:#df9849;
}

/* =====================================================
   DRAWER
===================================================== */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.34);

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:opacity .25s ease;
}

.overlay.open{
    opacity:1;

    pointer-events:auto;
}

.drawer{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:min(560px,80vw);

    background:#fff;

    z-index:110;

    transform:translateX(-105%);

    transition:transform .28s ease;

    box-shadow:5px 0 20px rgba(0,0,0,.2);

    overflow-x:hidden;
    overflow-y:auto;
}

.drawer.open{
    transform:translateX(0);
}

.drawer-profile{
    width:100%;

    min-height:323px;

    padding:34px 20px 25px;

    border:0;

    background:var(--gradient);

    text-align:center;

    display:block;

    overflow:hidden;
}

.drawer-photo{
    display:block;

    width:126px;
    height:126px;

    margin:0 auto;

    object-fit:cover;

    border-radius:50%;

    border:4px solid #fff;

    box-shadow:0 3px 11px rgba(0,0,0,.22);
}

.drawer-profile h2{
    margin-top:12px;

    color:#111;

    font-size:24px;
    line-height:1.25;

    font-weight:500;
}

.drawer-profile .reg{
    margin-top:5px;

    color:#222;

    font-size:18px;
    font-weight:400;
}

.drawer-profile .program{
    margin:9px auto 0;

    max-width:340px;

    color:#222;

    font-size:15px;
    line-height:1.45;

    font-weight:400;
}

.drawer-search{
    padding:16px 18px 9px;

    background:#fff;
}

.search-box{
    width:100%;

    height:50px;

    display:flex;
    align-items:center;

    gap:9px;

    padding:0 13px;

    border-radius:15px;

    background:#eeeeee;
}

.search-box .icon{
    width:24px;
    height:24px;

    color:#555;
}

.search-box input{
    min-width:0;
    width:100%;

    border:0;
    background:transparent;

    color:#444;

    font-size:17px;
    font-weight:400;
}

.search-box input::placeholder{
    color:#777;
}

.drawer-list{
    width:100%;
}

.drawer-item{
    width:100%;
    min-height:68px;

    border:0;
    border-bottom:1px solid #ececec;

    background:#fff;

    display:flex;
    align-items:center;

    gap:22px;

    padding:10px 19px;

    color:#666;

    text-align:left;

    font-size:15px;
    line-height:1.4;
    font-weight:400;
}

.drawer-item .icon{
    flex:0 0 28px;

    width:28px;
    height:28px;

    color:#555;
}

.drawer-item span{
    min-width:0;
}

.drawer-logout{
    width:calc(100% - 28px);

    min-height:55px;

    margin:15px 14px 25px;

    border:0;

    border-radius:28px;

    background:var(--gradient);

    color:#222;

    font-size:17px;
    font-weight:400;

    box-shadow:0 4px 9px rgba(0,0,0,.13);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-topbar{
    width:100%;

    height:64px;

    background:#303030;

    color:#fff;

    display:grid;

    grid-template-columns:50px minmax(0,1fr) 72px;

    align-items:center;

    padding:0 10px;

    position:sticky;

    top:0;

    z-index:60;
}

.profile-topbar-title{
    text-align:center;

    font-size:22px;
    font-weight:400;
}

.profile-topbar .back{
    width:44px;
    height:44px;

    border:0;
    background:transparent;

    color:#fff;

    display:grid;
    place-items:center;
}

.qr-top{
    width:68px;
    height:50px;

    border:0;

    border-radius:8px;

    background:#ff821c;

    color:#fff;

    font-size:19px;
    font-weight:400;
}

.profile-wrapper{
    width:100%;

    padding:14px 24px 30px;
}

.profile-card{
    width:100%;

    background:#fff;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.profile-hero{
    width:100%;

    background:var(--gradient);

    padding:34px 20px 30px;

    text-align:center;
}

.profile-photo{
    width:min(225px,52vw);
    height:min(225px,52vw);

    object-fit:cover;

    border-radius:18px;

    background:#fff;
}

.profile-name{
    margin-top:8px;

    color:#222;

    font-size:23px;
    font-weight:500;
}

.profile-program{
    margin-top:5px;

    color:#222;

    font-size:17px;
    line-height:1.45;

    font-weight:400;
}

.dark-heading{
    width:100%;

    padding:15px 12px;

    background:#303030;

    color:#fff;

    text-align:center;

    font-size:20px;
    font-weight:400;
}

.profile-row{
    padding:16px 36px 3px;
}

.profile-label{
    color:#666;

    font-size:17px;
    line-height:1.3;

    font-weight:500;
}

.profile-value{
    margin-top:4px;

    color:#777;

    font-size:17px;
    line-height:1.55;

    font-weight:400;

    overflow-wrap:anywhere;
}

/* =====================================================
   MESS
===================================================== */

.mess-topbar{
    height:64px;

    background:#303030;

    color:#fff;

    display:grid;

    grid-template-columns:50px minmax(0,1fr) auto;

    align-items:center;

    gap:5px;

    padding:0 10px;

    position:sticky;

    top:0;

    z-index:60;
}

.mess-topbar-title{
    text-align:center;

    font-size:20px;
    font-weight:400;

    white-space:nowrap;
}

.mess-history-btn{
    border:0;

    background:transparent;

    color:#fff;

    font-size:17px;
    font-weight:400;

    white-space:nowrap;
}

.mess-card{
    width:100%;

    background:var(--gradient);

    border-radius:0 0 10px 10px;

    padding:35px 36px 28px;
}

.mess-photo{
    width:min(225px,55vw);
    height:min(225px,55vw);

    display:block;

    margin:0 auto;

    object-fit:cover;

    border-radius:18px;
}

.mess-name{
    margin:7px 0 31px;

    text-align:center;

    color:#222;

    font-size:22px;
    font-weight:500;
}

.mess-info{
    margin-bottom:17px;

    color:#222;

    font-size:16px;
    line-height:1.45;

    overflow-wrap:anywhere;
}

.mess-info strong{
    display:block;

    margin-bottom:2px;

    font-weight:500;
}

.mess-content{
    background:#fff;

    padding-bottom:40px;
}

.mess-instruction{
    padding:57px 20px 18px;

    text-align:center;

    color:#111;

    font-size:26px;
    line-height:1.4;

    font-weight:300;
}

.rate-btn{
    display:block;

    margin:0 auto 27px;

    padding:3px 16px;

    border:3px solid #8d1717;

    border-radius:18px;

    background:#fff;

    color:#222;

    font-size:16px;
    font-weight:400;
}

.meal-grid{
    width:100%;
    max-width:560px;

    margin:0 auto;

    padding:0 20px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;
}

.meal-btn{
    min-width:0;

    min-height:76px;

    border:0;

    border-radius:9px;

    background:var(--gradient);

    color:#333;

    font-size:18px;
    font-weight:400;

    box-shadow:0 4px 9px rgba(0,0,0,.14);
}

/* =====================================================
   DATA PAGES
===================================================== */

.data-content{
    padding:25px 24px 30px;
}

.data-card{
    width:100%;

    background:#fff;

    border-radius:13px;

    padding:21px;

    margin-bottom:17px;

    box-shadow:var(--shadow);
}

.data-card h3{
    color:#222;

    font-size:18px;
    font-weight:500;
}

.data-card p{
    margin-top:5px;

    color:#777;

    font-size:14px;

    line-height:1.5;
}

.progress{
    width:100%;

    height:11px;

    margin-top:12px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    height:100%;

    background:var(--gradient);

    border-radius:20px;
}

.stat-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.stat-box{
    min-width:0;

    padding:18px 10px;

    border-radius:12px;

    background:var(--gradient);

    text-align:center;
}

.stat-box strong{
    display:block;

    color:#222;

    font-size:28px;
    font-weight:500;
}

.stat-box span{
    color:#444;

    font-size:12px;
}

.history-card{
    background:#fff;

    border-radius:12px;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.history-item{
    min-width:0;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    padding:16px 18px;

    border-bottom:1px solid #eee;
}

.history-item:last-child{
    border-bottom:0;
}

.history-item strong{
    color:#333;

    font-size:15px;
    font-weight:500;
}

.history-item div{
    font-size:13px;
}

.success{
    flex:0 0 auto;

    color:#4a985e;

    font-size:13px;
}

/* =====================================================
   MODALS
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:200;

    background:rgba(0,0,0,.48);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);

    max-height:90vh;

    overflow-y:auto;

    background:#fff;

    border-radius:17px;

    padding:23px;

    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.modal-title{
    margin-bottom:15px;

    color:#222;

    font-size:21px;
    font-weight:400;
}

.modal-actions{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-top:18px;
}

.primary-btn,
.secondary-btn{
    min-height:49px;

    border-radius:10px;

    font-size:15px;
    font-weight:400;
}

.primary-btn{
    border:0;

    background:var(--gradient);

    color:#222;

    box-shadow:0 4px 8px rgba(0,0,0,.13);
}

.secondary-btn{
    border:1px solid #ddd;

    background:#fff;

    color:#555;
}

.scanner{
    width:min(255px,70vw);
    height:min(255px,70vw);

    margin:20px auto;

    border:4px solid var(--coral);

    position:relative;

    background:#fff;
}

.scanner::before,
.scanner::after{
    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-color:#222;
}

.scanner::before{
    left:-4px;
    top:-4px;

    border-left:5px solid;
    border-top:5px solid;
}

.scanner::after{
    right:-4px;
    bottom:-4px;

    border-right:5px solid;
    border-bottom:5px solid;
}

.qr-pattern{
    width:185px;
    height:185px;

    margin:33px auto;

    display:grid;

    grid-template-columns:
        repeat(15,minmax(0,1fr));

    background:#fff;
}

.qr-cell{
    border:.5px solid #222;
}

/* =====================================================
   SETUP
===================================================== */

.setup-page{
    min-height:100vh;

    padding:30px 16px 45px;

    background:#fafafa;
}

.setup-container{
    width:min(700px,100%);

    margin:auto;
}

.setup-brand{
    text-align:center;

    margin-bottom:24px;
}

.setup-brand h1{
    color:#222;

    font-size:30px;
    font-weight:500;
}

.setup-brand p{
    margin-top:5px;

let visibleTiles=JSON.parse(
    localStorage.getItem("visibleTiles")||
    JSON.stringify(DEFAULT_TILES.map(x=>x[0]))
);

let history=JSON.parse(
    localStorage.getItem("mealHistory")||"[]"
);

let currentPage="dashboard";
let selectedTile="edu";


/* =====================================================
   HELPERS
===================================================== */

function esc(v){
    return String(v??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function saveProfile(){
    localStorage.setItem(
        "studentProfile",
        JSON.stringify(profile)
    );
}

function saveTiles(){
    localStorage.setItem(
        "visibleTiles",
        JSON.stringify(visibleTiles)
    );
}

function saveHistory(){
    localStorage.setItem(
        "mealHistory",
        JSON.stringify(history)
    );
}

function getTile(id){
    return DEFAULT_TILES.find(x=>x[0]===id);
}

function profileImage(cls){
    if(profile?.photo){
        return `<img class="${cls}" src="${profile.photo}">`;
    }

    return `
        <div class="${cls}"
        style="
        background:#eee;
        display:grid;
        place-items:center;
        color:#999;
        font-size:12px;
        ">
        PHOTO
        </div>
    `;
}

===================================================== */

        </div>

    `;

    let selectedPhoto="";

    document.getElementById("photoInput").onchange=e=>{

        const file=e.target.files[0];

        if(!file)return;

        const reader=new FileReader();

        reader.onload=event=>{

            selectedPhoto=event.target.result;

            document.getElementById("photoPreview").innerHTML=
            `<img
                class="photo-preview"
                src="${selectedPhoto}"
            >`;

        };

        reader.readAsDataURL(file);
    };


    document.getElementById("setupForm").onsubmit=e=>{

        e.preventDefault();

        const f=new FormData(e.target);

        profile={
            name:f.get("name"),
            registration:f.get("registration"),
            father:f.get("father"),
            mother:f.get("mother"),
            contact:f.get("contact"),
            email:f.get("email"),
            dob:f.get("dob"),
            gender:f.get("gender"),
            address:f.get("address"),
            correspondence:f.get("correspondence"),
            program:f.get("program"),
            session:f.get("session"),
            batch:f.get("batch"),
            section:f.get("section"),
            hostel:f.get("hostel"),
            room:f.get("room"),
            photo:selectedPhoto
        };

        saveProfile();

        dashboard();
    };
}

function tile(t){

    const id=t[0];
    const name=t[1];
    const icon=t[2];
    const badge=t[3];

    const removable=badge==="X";

    return `

    <div class="tile ${selectedTile===id ? "selected" : ""}">

        ${
            removable

            ?

            `<button
                class="tile-remove"
                onclick="removeTile('${id}')"
            >×</button>`

            :

            badge

            ?

            `<div class="tile-badge">
                ${badge}
            </div>`

            :""
        }

        <div class="tile-icon">
            ${I[icon]}
        </div>

        <button
            class="tile-label"
            onclick="tileClick('${id}')"
        >
            ${name}
        </button>

    </div>
    `;
}

function tileClick(id){

    if(id==="attendance")return attendancePage();
    if(id==="results")return resultsPage();
    if(id==="exams")return examsPage();
    if(id==="assignment")return assignmentsPage();
    if(id==="timetable")return timetablePage();
    if(id==="mess")return messPage();

    simplePage(
        getTile(id)?.[1]||"Module",
        "This module is available in the student ERP prototype."
    );
}

function removeTile(id){

    visibleTiles=visibleTiles.filter(x=>x!==id);

    saveTiles();

    dashboard();
}

function toggleAddTiles(){

    const el=document.getElementById("addTileMenu");

    if(!el)return;

    if(!el.classList.contains("hidden")){
        el.classList.add("hidden");
        return;
    }

    const available=DEFAULT_TILES.filter(
        x=>!visibleTiles.includes(x[0])
    );

    el.innerHTML=available.length

    ?

    available.map(x=>`
        <button
            class="add-chip"
            onclick="addTile('${x[0]}')"
        >
            + ${x[1]}
        </button>
    `).join("")

    :

    `<span style="font-size:12px;color:#777">
        All tiles are visible.
    </span>`;

    el.classList.remove("hidden");
}

function addTile(id){

    if(!visibleTiles.includes(id)){
        visibleTiles.push(id);
        saveTiles();
    }

    dashboard();
}

        font-size:14px;

            >

            </button>

            <button
                class="primary-btn"
                onclick="mealSuccess('${meal}')"
            >
                Simulate Scan
            </button>

        </div>
    `);

    generateQR("mealQR");
}

function generateQR(id){

    const box=document.getElementById(id);

    if(!box)return;

    box.innerHTML="";

    for(let i=0;i<225;i++){

        const c=document.createElement("div");

        if(
            Math.random()>.55 ||
            i<45 ||
            i%15<3
        ){
            c.style.background="#222";
        }

        c.className="qr-cell";

        box.appendChild(c);
    }
}

function mealSuccess(meal){

    const d=new Date();

    history.push({

        meal,

        date:d.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        ),

        time:d.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )

    });

    saveHistory();

    modal(`

            <div style="

/* =====================================================
   PROFILE EDIT
===================================================== */

function editProfile(){

    modal(`

        <h2 class="modal-title">
            Edit Profile
        </h2>

        <form id="editForm">

            ${field("Full Name","name",profile.name)}
            ${field("Registration Number","registration",profile.registration)}
            ${field("Father's Name","father",profile.father)}
            ${field("Mother's Name","mother",profile.mother)}
            ${field("Contact Number","contact",profile.contact)}
            ${field("Email","email",profile.email)}
            ${areaValue("Permanent Address","address",profile.address)}
            ${areaValue("Correspondence Address","correspondence",profile.correspondence)}
            ${field("Program","program",profile.program)}
            ${field("Hostel","hostel",profile.hostel)}
            ${field("Room / Bed","room",profile.room)}

            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save
                </button>

            </div>

        </form>
    `);

    document.getElementById("editForm").onsubmit=e=>{

        e.preventDefault();

        const f=new FormData(e.target);

        [
            "name",
            "registration",
            "father",
            "mother",
            "contact",
            "email",
            "address",
            "correspondence",
            "program",
            "hostel",
            "room"
        ].forEach(k=>{
            profile[k]=f.get(k);
        });

        saveProfile();

        closeModal();

        profilePage();
    };
}

function areaValue(label,name,value){

    return `
        <div
            class="form-group"
            style="margin-top:12px"
        >
            <label>${label}</label>

            <textarea
                name="${name}"
            >${esc(value)}</textarea>
        </div>
    `;
}

/* =====================================================
   MODAL
===================================================== */

function modal(html){

    document.getElementById("modalContent").innerHTML=html;

    document.getElementById("modal")
        .classList.add("show");
}

function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");
}

document.getElementById("modal").onclick=e=>{

    if(e.target.id==="modal"){
        closeModal();
    }
};

function logout(){

    closeModal();

    /*
       Keep profile locally saved.
       Just return to dashboard/setup-like state.
    */
    dashboard();
}

function resetApp(){

    localStorage.clear();

    profile=null;

    visibleTiles=
        DEFAULT_TILES.map(x=>x[0]);

    history=[];

    closeModal();

    setup();
}


/* =====================================================

===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            closeModal();
            closeDrawer();

        }

    }
);

===================================================== */

if(profile){

    dashboard();

}else{

}
