<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOVE.EXE // TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff69b4;
    --pink-bright:#ffb6d9;
    --pink-dim:#ff2f92;
    --pink-soft:#ff9ecb;
    --black:#000000;
    --mono:'JetBrains Mono','Courier New',ui-monospace,'Consolas',monospace;
    --script:'Great Vibes',cursive;
    --serif:'Cormorant Garamond',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--black);
    overflow:hidden;
    font-family:var(--mono);
    cursor:none;
  }
  #app{position:fixed;inset:0;overflow:hidden;}

  /* ---------- LAYERED CANVASES ---------- */
  canvas{position:absolute;top:0;left:0;display:block;}
  #bgCanvas{z-index:1;}
  #rainCanvas{z-index:2;}
  #fxCanvas{z-index:5;}
  #noiseCanvas{z-index:8;opacity:.04;mix-blend-mode:overlay;pointer-events:none;}

  /* ---------- VIGNETTE / FOG ---------- */
  #vignette{position:fixed;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.92) 100%);}
  #fog{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:
      radial-gradient(circle at 30% 70%, rgba(255,105,180,.06), transparent 60%),
      radial-gradient(circle at 75% 25%, rgba(255,105,180,.05), transparent 55%);
    animation:fogDrift 14s ease-in-out infinite alternate;}
  @keyframes fogDrift{0%{opacity:.5;transform:scale(1) translate(0,0);}100%{opacity:.9;transform:scale(1.08) translate(-1%,1%);}}

  /* ---------- SCANLINES + CRT ---------- */
  #scanlines{position:fixed;inset:0;z-index:9;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(255,105,180,.05) 0px,rgba(255,105,180,.05) 1px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 3px);
    animation:scanMove 9s linear infinite;mix-blend-mode:overlay;}
  @keyframes scanMove{0%{background-position:0 0;}100%{background-position:0 100px;}}
  #crtCurve{position:fixed;inset:0;z-index:10;pointer-events:none;
    box-shadow:0 0 180px rgba(0,0,0,.85), inset 0 0 60px rgba(255,105,180,.08);}
  #flicker{position:fixed;inset:0;z-index:11;pointer-events:none;background:rgba(255,105,180,.02);animation:flick 6s infinite steps(1);}
  @keyframes flick{0%,100%{opacity:0;}3%{opacity:1;}3.2%{opacity:0;}41%{opacity:0;}41.4%{opacity:.6;}41.6%{opacity:0;}72%{opacity:0;}72.2%{opacity:.4;}72.5%{opacity:0;}}

  /* ---------- STATUS BAR ---------- */
  #statusBar{position:fixed;top:14px;left:18px;z-index:20;display:flex;align-items:center;
    color:var(--pink);font-size:12px;letter-spacing:3px;text-shadow:0 0 8px var(--pink);
    opacity:0;transition:opacity 1.4s ease;}
  #statusBar.show{opacity:.85;}
  #statusBar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);
    box-shadow:0 0 8px var(--pink), 0 0 16px var(--pink);margin-right:8px;animation:pulseDot 1.6s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}

  /* ---------- INTRO OVERLAY ---------- */
  #intro{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);display:flex;align-items:center;
    justify-content:center;flex-direction:column;transition:opacity 1.2s ease;pointer-events:none;}
  #introType{font-size:clamp(22px,4.5vw,48px);color:var(--pink);
    text-shadow:0 0 12px var(--pink), 0 0 30px rgba(255,105,180,.6);letter-spacing:4px;white-space:pre;}
  #introType .cursor{display:inline-block;width:.55em;background:var(--pink);box-shadow:0 0 10px var(--pink);
    animation:blink 1s step-end infinite;margin-left:2px;}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  /* ---------- CONFESSION REVEAL ---------- */
  #bigConfession{position:fixed;inset:0;z-index:101;display:none;align-items:center;justify-content:center;pointer-events:none;}
  .confess-card{position:relative;text-align:center;padding:70px 90px;opacity:0;transform:scale(.9);
    animation:cardIn 1.1s cubic-bezier(.2,.9,.25,1) forwards;}
  .confess-card::before{content:'';position:absolute;inset:0;border-radius:24px;
    background:rgba(20,2,12,.25);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
    border:1px solid rgba(255,182,217,.18);box-shadow:0 0 60px rgba(255,105,180,.12), inset 0 0 40px rgba(255,105,180,.05);
    z-index:-1;}
  .confess-eyebrow{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:9px;text-transform:uppercase;
    color:var(--pink-bright);opacity:0;text-shadow:0 0 8px var(--pink);margin-bottom:22px;
    animation:eyebrowIn .7s ease .55s forwards;}
  .confess-heart{display:inline-block;font-size:34px;color:var(--pink);margin-bottom:6px;opacity:0;
    filter:drop-shadow(0 0 14px var(--pink));
    animation:heartIn .6s cubic-bezier(.2,.9,.3,1.4) .9s forwards, heartbeat 1.5s ease-in-out 1.6s infinite;}
  .confess-main{position:relative;display:inline-block;font-family:var(--script);font-weight:400;
    font-size:clamp(64px,14vw,175px);line-height:1;
    background:linear-gradient(120deg,#ff2f92 0%,#ff9ecb 22%,#ffffff 40%,#ffe1f0 55%,#ff9ecb 70%,#ff2f92 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:mainReveal 1.1s cubic-bezier(.16,.85,.24,1) 1.2s both,
              confessGlow 2.4s ease-in-out 2.3s infinite,
              shimmerSweep 3.6s linear 2.3s infinite;}
  .confess-underline{width:0;height:1px;margin:26px auto 0;
    background:linear-gradient(90deg,transparent,var(--pink-bright),transparent);
    animation:underlineIn 1s ease 2.6s forwards;}
  .confess-sub{margin-top:16px;font-family:var(--serif);font-style:italic;font-weight:500;
    font-size:clamp(14px,2vw,21px);letter-spacing:2px;color:var(--pink-bright);opacity:0;
    animation:subIn .9s ease 3s forwards;}

  .confess-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(255,158,203,.45);
    transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;z-index:-1;
    width:280px;height:280px;animation:ringPulse 2.6s cubic-bezier(.2,.7,.3,1) 1.2s infinite;}
  .confess-ring.ring2{animation-delay:2.5s;border-color:rgba(255,105,180,.3);}
  .confess-orbit{position:absolute;inset:-190px;pointer-events:none;z-index:-1;opacity:0;
    animation:orbitFadeIn 1s ease 1.8s forwards, orbitSpin 22s linear 1.8s infinite;}
  .orbit-heart{position:absolute;left:50%;top:50%;font-size:14px;color:var(--pink-soft);
    filter:drop-shadow(0 0 6px var(--pink));transform-origin:0 0;}

  @keyframes cardIn{to{opacity:1;transform:scale(1);}}
  @keyframes eyebrowIn{to{opacity:.7;}}
  @keyframes heartIn{0%{opacity:0;transform:scale(.3) translateY(10px);}100%{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.18);}30%{transform:scale(1);}45%{transform:scale(1.14);}60%{transform:scale(1);}}
  @keyframes underlineIn{to{width:130px;}}
  @keyframes subIn{to{opacity:.85;}}
  @keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(.4);opacity:.7;border-width:1.5px;}
    75%{opacity:0;}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0;}}
  @keyframes orbitFadeIn{to{opacity:.8;}}
  @keyframes orbitSpin{to{transform:rotate(360deg);}}

  /* glitch-into-focus entrance: chromatic split resolves into clean glow */
  @keyframes mainReveal{
    0%{opacity:0;transform:scale(.7) translateY(6px);filter:blur(16px);
      text-shadow:-4px 0 rgba(102,255,240,.85),4px 0 rgba(255,47,146,.85);}
    30%{opacity:1;transform:scale(1.1) translateY(0);filter:blur(4px);
      text-shadow:-2px 0 rgba(102,255,240,.6),2px 0 rgba(255,47,146,.6);}
    45%{transform:scale(.96);filter:blur(1px);text-shadow:1px 0 rgba(255,47,146,.3),-1px 0 rgba(102,255,240,.3);}
    60%{transform:scale(1.03);filter:blur(0);text-shadow:none;}
    75%{transform:scale(.99);}
    100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);text-shadow:none;}
  }
  @keyframes confessGlow{0%,100%{filter:drop-shadow(0 0 28px rgba(255,105,180,.55)) drop-shadow(0 0 64px rgba(255,47,146,.35));}
    50%{filter:drop-shadow(0 0 44px rgba(255,105,180,.85)) drop-shadow(0 0 100px rgba(255,47,146,.55));}}
  @keyframes shimmerSweep{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}

  #bigConfession.fadeOut .confess-card{transition:opacity .9s ease, transform .9s ease;opacity:0;transform:scale(1.1);}

  /* ---------- MOUSE CURSOR REPLACEMENT ---------- */
  #cursorDot{position:fixed;top:0;left:0;z-index:200;width:8px;height:8px;border-radius:50%;
    background:var(--pink-bright);box-shadow:0 0 10px var(--pink), 0 0 22px var(--pink);
    pointer-events:none;transform:translate(-50%,-50%);}

  ::selection{background:var(--pink);color:#000;}
</style>
</head>
<body>
<div id="app">
  <canvas id="bgCanvas"></canvas>
  <canvas id="rainCanvas"></canvas>
  <div id="fog"></div>
  <canvas id="fxCanvas"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="crtCurve"></div>
  <div id="flicker"></div>
  <canvas id="noiseCanvas"></canvas>

  <div id="statusBar"><span class="dot"></span>HEART_LINK.SYS — CONNECTION STABLE</div>
</div>

<div id="intro">
  <div id="introType"></div>
</div>

<div id="bigConfession">
  <div class="confess-card">
    <div class="confess-ring ring1"></div>
    <div class="confess-ring ring2"></div>
    <div class="confess-orbit" id="confessOrbit"></div>
    <div class="confess-eyebrow">Transmission Decoded</div>
    <div class="confess-heart">❤</div>
    <div class="confess-main">I love you jaaaan</div>
    <div class="confess-underline"></div>
    <div class="confess-sub">every line of this was written for you</div>
  </div>
</div>

<div id="cursorDot"></div>

<script>
(function(){
"use strict";

/* =========================================================
   CUSTOM CURSOR
========================================================= */
const cursorDot = document.getElementById('cursorDot');
let mouseX = innerWidth/2, mouseY = innerHeight/2;
window.addEventListener('mousemove', e=>{
  mouseX = e.clientX; mouseY = e.clientY;
  cursorDot.style.left = mouseX+'px';
  cursorDot.style.top = mouseY+'px';
  spawnMouseTrail(mouseX, mouseY);
});
window.addEventListener('click', e=> spawnRipple(e.clientX, e.clientY));
window.addEventListener('touchmove', e=>{
  const t = e.touches[0]; if(!t) return;
  mouseX=t.clientX; mouseY=t.clientY;
  cursorDot.style.left = mouseX+'px';
  cursorDot.style.top = mouseY+'px';
  spawnMouseTrail(mouseX, mouseY);
},{passive:true});

/* =========================================================
   WORD POOL
========================================================= */
const WORDS = [
  "Love U ❤️","I Love You","Honey","Cutiie","Bby","Sona","My Princess","My Queen",
  "Forever","Mine","Sweetheart","Angel","Beautiful","My Heart","My Soul","Kiss",
  "Hug","Love","Always","Missing You","You are Mine","Cute Girl","My Sunshine",
  "❤️❤️❤️","💕💕💕","💖💖💖","Soulmate","My Everything","Adore You","Baby",
  "My Love","Only You","Yours Forever","Precious","Darling","My World"
];

const HEX_TAGS = [
  "LOVE_U_FOUND","CUTIIE","HONEY","MY_PRINCESS","BBY","SOUL_CONNECTED",
  "HEART_FOUND","FOREVER","MINE","SWEETHEART","ANGEL_SIGNAL_LOCKED",
  "SUNSHINE_DETECTED","QUEEN_STATUS_CONFIRMED","MINE_FOREVER.SYS","KISS_PROTOCOL_ARMED"
];

function randHex(len){
  let s='';
  const chars='0123456789ABCDEF';
  for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*16)];
  return s;
}
// double-space Fallout-style row, used in the falling hacker rows
function randomHexRow(){
  return `0x${randHex(4)}  ${HEX_TAGS[Math.floor(Math.random()*HEX_TAGS.length)]}`;
}

/* =========================================================
   RESIZE HELPERS
========================================================= */
function fit(canvas){
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth+'px';
  canvas.style.height = innerHeight+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  return ctx;
}

/* =========================================================
   BACKGROUND LAYER: stars, floating hearts, sparkles
========================================================= */
const bgCanvas = document.getElementById('bgCanvas');
let bgCtx = fit(bgCanvas);
let stars=[], hearts=[], sparkles=[];

function initBg(){
  stars=[]; hearts=[]; sparkles=[];
  const area = innerWidth*innerHeight;
  const starCount = Math.min(140, Math.floor(area/10000));
  for(let i=0;i<starCount;i++){
    stars.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.4+.3, tw:Math.random()*Math.PI*2, sp:Math.random()*.02+.01
    });
  }
  const heartCount = Math.min(18, Math.floor(area/45000));
  for(let i=0;i<heartCount;i++){
    hearts.push(makeHeart());
  }
  const sparkCount = Math.min(38, Math.floor(area/18000));
  for(let i=0;i<sparkCount;i++){
    sparkles.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      life:Math.random()*100, maxLife:Math.random()*80+60,
      r:Math.random()*1.5+.5
    });
  }
}
function makeHeart(){
  return {
    x:Math.random()*innerWidth,
    y:innerHeight + Math.random()*200,
    size:Math.random()*14+6,
    speed:Math.random()*.35+.12,
    sway:Math.random()*Math.PI*2,
    swaySpeed:Math.random()*.02+.008,
    opacity:Math.random()*.3+.12
  };
}
function drawHeart(ctx,x,y,size,opacity){
  ctx.save();
  ctx.translate(x,y);
  ctx.globalAlpha = opacity;
  ctx.fillStyle = '#ff69b4';
  ctx.shadowColor = '#ff69b4';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  const s = size/16;
  ctx.moveTo(0, 4*s);
  ctx.bezierCurveTo(0,-2*s, -8*s,-2*s, -8*s,4*s);
  ctx.bezierCurveTo(-8*s,9*s, 0,13*s, 0,17*s);
  ctx.bezierCurveTo(0,13*s, 8*s,9*s, 8*s,4*s);
  ctx.bezierCurveTo(8*s,-2*s, 0,-2*s, 0,4*s);
  ctx.fill();
  ctx.restore();
}

function stepBg(){
  bgCtx.clearRect(0,0,innerWidth,innerHeight);
  // stars
  for(const s of stars){
    s.tw += s.sp;
    const a = .35 + Math.sin(s.tw)*.35;
    bgCtx.globalAlpha = Math.max(0,a);
    bgCtx.fillStyle = '#ffdcee';
    bgCtx.beginPath();
    bgCtx.arc(s.x,s.y,s.r,0,7);
    bgCtx.fill();
  }
  bgCtx.globalAlpha=1;
  // sparkles
  for(const sp of sparkles){
    sp.life += 1;
    if(sp.life>sp.maxLife){ sp.life=0; sp.x=Math.random()*innerWidth; sp.y=Math.random()*innerHeight; }
    const t = sp.life/sp.maxLife;
    const a = Math.sin(t*Math.PI);
    bgCtx.globalAlpha = a*.7;
    bgCtx.fillStyle = '#ffb6d9';
    bgCtx.shadowColor = '#ff69b4';
    bgCtx.shadowBlur = 8;
    bgCtx.beginPath();
    bgCtx.arc(sp.x,sp.y,sp.r,0,7);
    bgCtx.fill();
  }
  bgCtx.shadowBlur=0; bgCtx.globalAlpha=1;
  // floating hearts
  for(const h of hearts){
    h.y -= h.speed;
    h.sway += h.swaySpeed;
    const x = h.x + Math.sin(h.sway)*18;
    drawHeart(bgCtx, x, h.y, h.size, h.opacity);
    if(h.y < -30){ Object.assign(h, makeHeart(), {y: innerHeight+30}); }
  }
  bgCtx.globalAlpha=1;
}

/* =========================================================
   WORD RAIN — main hacking-terminal effect
========================================================= */
const rainCanvas = document.getElementById('rainCanvas');
let rainCtx = fit(rainCanvas);
let particles = [];
const MAX_PARTICLES = 260; // trimmed for a cleaner, less cluttered feed
let totalSpawned = 0;

function spawnWord(){
  // orthogonal movement only — no diagonals, no zig-zag
  const dirs = [
    {vx:0, vy:-1}, // Up
    {vx:0, vy:1},  // Down
    {vx:-1, vy:0}, // Left
    {vx:1, vy:0}   // Right
  ];
  const d = dirs[Math.floor(Math.random()*dirs.length)];
  const speed = Math.random()*1.6 + 1.2;
  const fromEdge = pickEdgeStart(d);
  const behaviors = ['plain','fade'];
  const behavior = behaviors[Math.floor(Math.random()*behaviors.length)];
  // mostly Fallout-style hex rows, rest romantic words
  const isHex = Math.random() < .45;
  const text = isHex ? randomHexRow() : WORDS[Math.floor(Math.random()*WORDS.length)];
  particles.push({
    text, isHex,
    x: fromEdge.x, y: fromEdge.y,
    vx: d.vx*speed, vy: d.vy*speed,
    opacity: behavior==='fade' ? 0 : (Math.random()*.35+.45),
    fadeDir: 1,
    baseOpacity: Math.random()*.3+.45,
    behavior,
    size: isHex ? (Math.random()*3+10) : (Math.random()*8+13),
    life: 0,
    maxLife: Math.random()*480 + 380
  });
  totalSpawned++;
}
function pickEdgeStart(d){
  const w=innerWidth, h=innerHeight;
  let x,y;
  if(d.vy < 0) y = h + 30; else if(d.vy>0) y = -30; else y = Math.random()*h;
  if(d.vx < 0) x = w + 60; else if(d.vx>0) x = -60; else x = Math.random()*w;
  if(d.vx!==0 && d.vy!==0){ x = Math.random()<.5 ? -60 : w+60; y = Math.random()*h; }
  return {x,y};
}

let rainActive = false;
function stepRain(){
  if(!rainActive) return;
  rainCtx.clearRect(0,0,innerWidth,innerHeight);
  if(particles.length < MAX_PARTICLES){
    const burst = Math.random()<.5 ? 2 : 1;
    for(let i=0;i<burst;i++) spawnWord();
  }
  rainCtx.textAlign='center';
  rainCtx.textBaseline='middle';

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life++;
    p.x += p.vx; p.y += p.vy;

    if(p.behavior==='fade'){
      p.opacity += p.fadeDir*0.01;
      if(p.opacity>p.baseOpacity){p.opacity=p.baseOpacity; p.fadeDir=-1;}
      if(p.opacity<0){p.fadeDir=1;}
    }

    const offEdge = p.x < -220 || p.x > innerWidth+220 || p.y < -120 || p.y > innerHeight+120;
    if(p.life > p.maxLife || offEdge){
      particles.splice(i,1);
      continue;
    }

    let alpha = p.opacity;
    const fadeInLen = 40, fadeOutStart = p.maxLife-60;
    if(p.life < fadeInLen) alpha *= (p.life/fadeInLen);
    else if(p.life > fadeOutStart) alpha *= Math.max(0,(p.maxLife-p.life)/60);

    rainCtx.save();
    rainCtx.translate(p.x,p.y);
    rainCtx.globalAlpha = Math.max(0,Math.min(1,alpha));
    rainCtx.font = `${p.isHex?'500 ':'700 '}${p.size}px 'JetBrains Mono', 'Courier New', monospace`;
    rainCtx.fillStyle = p.isHex ? '#ff9ecb' : '#ff69b4';
    rainCtx.shadowColor = '#ff69b4';
    rainCtx.shadowBlur = p.isHex ? 6 : 12;
    rainCtx.fillText(p.text, 0, 0);
    rainCtx.restore();
  }
  rainCtx.globalAlpha=1;
}

/* =========================================================
   FX LAYER — mouse trail, hearts, ripples, sparks
========================================================= */
const fxCanvas = document.getElementById('fxCanvas');
let fxCtx = fit(fxCanvas);
let trail = [];
let ripples = [];
let lastTrailTime = 0;

function spawnMouseTrail(x,y){
  const now = performance.now();
  if(now - lastTrailTime < 28) return;
  lastTrailTime = now;
  trail.push({x,y,life:0,maxLife:34, type:'glow'});
  if(Math.random()<.35){
    trail.push({x:x+(Math.random()*10-5),y:y+(Math.random()*10-5),life:0,maxLife:50,type:'heart', size:Math.random()*6+5});
  }
  if(Math.random()<.5){
    for(let i=0;i<2;i++){
      trail.push({
        x, y, life:0, maxLife:30, type:'spark',
        vx:(Math.random()*2-1)*1.6, vy:(Math.random()*2-1)*1.6
      });
    }
  }
  if(trail.length>160) trail.splice(0, trail.length-160);
}
function spawnRipple(x,y){
  ripples.push({x,y,r:2,life:0,maxLife:40});
}
function spawnLoveBurst(cx,cy,count){
  count = count || 50;
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*4.5 + 1.5;
    const isHeart = Math.random() < .45;
    if(isHeart){
      trail.push({
        x:cx, y:cy, life:0, maxLife:Math.random()*50+90, type:'heart',
        size:Math.random()*10+7,
        vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed
      });
    } else {
      trail.push({
        x:cx, y:cy, life:0, maxLife:Math.random()*40+60, type:'spark',
        vx:Math.cos(angle)*speed*1.4, vy:Math.sin(angle)*speed*1.4,
        decay:0.96
      });
    }
  }
  spawnRipple(cx,cy);
}

function stepFx(){
  fxCtx.clearRect(0,0,innerWidth,innerHeight);

  for(let i=trail.length-1;i>=0;i--){
    const t = trail[i];
    t.life++;
    const a = 1 - t.life/t.maxLife;
    if(a<=0){ trail.splice(i,1); continue; }
    if(t.type==='glow'){
      fxCtx.globalAlpha = a*.5;
      fxCtx.fillStyle='#ff69b4';
      fxCtx.shadowColor='#ff69b4'; fxCtx.shadowBlur=16;
      fxCtx.beginPath(); fxCtx.arc(t.x,t.y,4,0,7); fxCtx.fill();
    } else if(t.type==='heart'){
      if(t.vx!==undefined){
        t.x += t.vx; t.y += t.vy; t.vx*=0.985; t.vy*=0.985;
        drawHeart(fxCtx, t.x, t.y, t.size, a*.85);
      } else {
        drawHeart(fxCtx, t.x, t.y - t.life*.4, t.size, a*.8);
      }
    } else if(t.type==='spark'){
      t.x += t.vx; t.y += t.vy;
      if(t.decay){ t.vx*=t.decay; t.vy*=t.decay; }
      fxCtx.globalAlpha = a;
      fxCtx.fillStyle = '#ffe1f0';
      fxCtx.shadowColor='#ff69b4'; fxCtx.shadowBlur=10;
      fxCtx.beginPath(); fxCtx.arc(t.x,t.y,1.6,0,7); fxCtx.fill();
    }
  }
  fxCtx.shadowBlur=0; fxCtx.globalAlpha=1;

  for(let i=ripples.length-1;i>=0;i--){
    const r = ripples[i];
    r.life++; r.r += 3.2;
    const a = 1-r.life/r.maxLife;
    if(a<=0){ ripples.splice(i,1); continue; }
    fxCtx.globalAlpha = a*.6;
    fxCtx.strokeStyle = '#ff69b4';
    fxCtx.shadowColor='#ff69b4'; fxCtx.shadowBlur=14;
    fxCtx.lineWidth = 1.5;
    fxCtx.beginPath(); fxCtx.arc(r.x,r.y,r.r,0,7); fxCtx.stroke();
  }
  fxCtx.globalAlpha=1; fxCtx.shadowBlur=0;
}

/* =========================================================
   VHS NOISE LAYER (cheap, low-res upscaled)
========================================================= */
const noiseCanvas = document.getElementById('noiseCanvas');
const NW=100, NH=60;
noiseCanvas.width=NW; noiseCanvas.height=NH;
function sizeNoiseCss(){
  noiseCanvas.style.width = innerWidth+'px';
  noiseCanvas.style.height = innerHeight+'px';
}
const noiseCtx = noiseCanvas.getContext('2d');
function drawNoise(){
  const imgData = noiseCtx.createImageData(NW,NH);
  const buf = imgData.data;
  for(let i=0;i<buf.length;i+=4){
    const v = Math.random()*255;
    buf[i]=v; buf[i+1]=v*0.6; buf[i+2]=v*0.8; buf[i+3]=Math.random()*45;
  }
  noiseCtx.putImageData(imgData,0,0);
}
setInterval(drawNoise, 110);

/* =========================================================
   MAIN LOOP
========================================================= */
function loop(){
  stepBg();
  stepRain();
  stepFx();
  requestAnimationFrame(loop);
}

/* =========================================================
   RESIZE
========================================================= */
function handleResize(){
  bgCtx = fit(bgCanvas);
  rainCtx = fit(rainCanvas);
  fxCtx = fit(fxCanvas);
  sizeNoiseCss();
  initBg();
}
window.addEventListener('resize', handleResize);

/* =========================================================
   INTRO SEQUENCE
========================================================= */
const introType = document.getElementById('introType');
const introEl = document.getElementById('intro');
const bigConfession = document.getElementById('bigConfession');
const statusBar = document.getElementById('statusBar');

// build the ring of orbiting hearts around the confession
(function buildOrbit(){
  const orbit = document.getElementById('confessOrbit');
  if(!orbit) return;
  const n = 8, radius = 190;
  for(let i=0;i<n;i++){
    const angle = (360/n)*i;
    const heart = document.createElement('span');
    heart.className = 'orbit-heart';
    heart.textContent = i%2===0 ? '❤' : '✦';
    heart.style.transform = `rotate(${angle}deg) translateX(${radius}px) rotate(${-angle}deg)`;
    heart.style.opacity = (0.35 + Math.random()*0.4).toFixed(2);
    orbit.appendChild(heart);
  }
})();

function typeText(el, text, speed){
  return new Promise(resolve=>{
    let i=0;
    const cursor = '<span class="cursor">&nbsp;</span>';
    (function tick(){
      el.innerHTML = text.slice(0,i) + cursor;
      i++;
      if(i<=text.length){
        setTimeout(tick, speed);
      } else {
        resolve();
      }
    })();
  });
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function clearType(){
  introType.innerHTML = '<span class="cursor">&nbsp;</span>';
}

async function runIntro(){
  // the matrix never stops — start it immediately, behind the intro text
  rainActive = true;
  statusBar.classList.add('show');

  // type, clear, retype — like someone typing line by line in a terminal
  await wait(500);
  await typeText(introType, '>', 90);
  await wait(500);
  clearType();
  await wait(250);

  await typeText(introType, '> I', 140);
  await wait(650);
  clearType();
  await wait(250);

  await typeText(introType, '> I LOVE', 110);
  await wait(650);
  clearType();
  await wait(250);

  await typeText(introType, '> I LOVE YOU \u2764\uFE0F', 130);
  await wait(750);

  introEl.style.transition = 'opacity .6s ease';
  introEl.style.opacity = '0';
  await wait(600);
  introEl.style.display='none';

  bigConfession.style.display='flex';
  const cx = innerWidth/2, cy = innerHeight/2;
  spawnLoveBurst(cx, cy, 55);
  await wait(1200);
  spawnLoveBurst(cx, cy, 30);
  await wait(1000);
  spawnLoveBurst(cx, cy, 22);
  await wait(1000);
  bigConfession.classList.add('fadeOut');
  await wait(900);
  bigConfession.style.display='none';
  // matrix and status bar were already running behind the intro
}

/* =========================================================
   BOOT
========================================================= */
initBg();
sizeNoiseCss();
loop();

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(runIntro).catch(runIntro);
} else {
  runIntro();
}

})();
</script>
