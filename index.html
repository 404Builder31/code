<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Student ERP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

:root{
    --coral:#ff7f73;
    --orange:#ff9d77;
    --peach:#ffb879;
    --yellow:#ffd36f;
    --dark:#303030;
    --text:#555;
    --black:#222;
    --muted:#777;
    --cream:#fffaf0;
    --page:#fafafa;

    --gradient:
        linear-gradient(
            100deg,
            #ff7f73 0%,
            #ffad79 48%,
            #ffd36f 100%
        );

    --shadow:
        0 3px 9px rgba(0,0,0,.11);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
    background:var(--page);
    color:var(--text);
    font-family:Poppins,Arial,sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button,
input,
textarea,
select{
    outline:none;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}

/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
}

.page{
    width:100%;
    min-height:100vh;
    padding-bottom:82px;
    overflow-x:hidden;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:64px;
    width:100%;
    background:#fff;

    display:grid;
    grid-template-columns:50px minmax(0,1fr) 50px;
    align-items:center;

    padding:0 10px;

    position:sticky;
    top:0;
    z-index:50;

    box-shadow:0 2px 7px rgba(0,0,0,.13);
}

.topbar-title{
    min-width:0;
    text-align:center;

    color:#222;
    font-size:23px;
    font-weight:400;

    white-space:nowrap;
}

.topbar-btn{
    width:44px;
    height:44px;

    border:0;
    background:transparent;

    display:grid;
    place-items:center;

    color:#444;

    position:relative;
}

.icon{
    width:25px;
    height:25px;

    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.notification-badge{
    position:absolute;

    right:0;
    top:1px;

    min-width:27px;
    height:27px;

    padding:0 5px;

    border-radius:9px;

    background:var(--gradient);

    display:grid;
    place-items:center;

    color:#222;
    font-size:12px;
    font-weight:400;
}

/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content{
    width:100%;
    max-width:1000px;

    margin:0 auto;

    padding:25px 24px 30px;

    overflow-x:hidden;
}

.section-title{
    margin:0 0 17px;

    color:#111;

    font-size:25px;
    line-height:1.25;
    font-weight:400;
}

/* =====================================================
   TIMETABLE
===================================================== */

.timetable-section{
    width:100%;
    margin-bottom:35px;
}

.timetable-scroll{
    width:100%;

    display:flex;
    gap:16px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:3px 2px 12px;

    scrollbar-width:none;
}

.timetable-scroll::-webkit-scrollbar{
    display:none;
}

.timetable-card{
    flex:0 0 min(305px,82vw);

    height:212px;

    position:relative;

    overflow:hidden;

    border-radius:11px;

    background:var(--gradient);

    box-shadow:var(--shadow);

    padding:25px 23px;
}

.course-code{
    color:#222;

    font-size:24px;
    font-weight:600;
    line-height:1.2;
}

.room{
    margin-top:7px;

    color:#333;

    font-size:15px;
    font-weight:400;
}

.status-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;

    margin-top:17px;

    padding:6px 12px;

    border-radius:18px;

    background:#ffd078;

    color:#444;

    font-size:13px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ed7e20;
}

.time-strip{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#303030;

    color:#fff;

    font-size:17px;
    font-weight:500;
}

/* decorative book-like lines */
.timetable-card::after{
    content:"";

    position:absolute;

    width:110px;
    height:70px;

    right:-15px;
    bottom:37px;

    border:3px solid rgba(255,255,255,.23);
    border-radius:50%;

    transform:rotate(-15deg);
}

/* =====================================================
   TILES HEADER
===================================================== */

.tiles-heading{
    margin-bottom:19px;
}

.tiles-heading h2{
    color:#111;

    font-size:24px;
    line-height:1.3;
    font-weight:400;
}

.tiles-heading p{
    margin-top:6px;

    color:#222;

    font-size:13px;
    line-height:1.4;
    font-weight:400;
}

/* =====================================================
   TILE GRID
===================================================== */

.tile-grid{
    width:100%;

    display:grid;

    /*
       VERY IMPORTANT:
       minmax(0,1fr) prevents the cards from
       pushing the third column outside viewport.
    */
    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:17px 13px;

    overflow:visible;
}

.tile{
    min-width:0;
    width:100%;

    min-height:218px;

    position:relative;

    background:var(--cream);

    border:1px solid #e8e0d1;
    border-radius:12px;

    box-shadow:
        0 3px 7px rgba(0,0,0,.08);

    padding:28px 7px 13px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    overflow:visible;
}

.tile-icon{
    width:58px;
    height:58px;

    flex:0 0 auto;

    margin-bottom:16px;

    color:#333;

    display:grid;
    place-items:center;
}

.tile-icon .icon{
    width:100%;
    height:100%;

    stroke-width:1.55;
}

.tile-label{
    width:100%;
    min-width:0;
    max-width:100%;

    border:0;

    background:#ffbd7b;

    border-radius:8px;

    padding:7px 4px;

    color:#222;

    font-size:12px;
    line-height:1.25;
    font-weight:400;

    text-align:center;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:normal;
}

.tile-badge,
.tile-remove{
    position:absolute;

    right:-1px;
    top:-15px;

    min-width:39px;
    height:39px;

    padding:0 6px;

    border-radius:9px;

    background:var(--gradient);

    display:grid;
    place-items:center;

    color:#222;

    font-size:12px;
    font-weight:400;

    z-index:3;
}

.tile-remove{
    border:0;

    font-size:19px;
}

.add-tiles{
    margin-bottom:20px;
}

.add-tile-menu{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.add-chip{
    border:1px solid #ddd;

    background:#fff;

    border-radius:20px;

    padding:7px 11px;

    color:#555;

    font-size:12px;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;

    height:74px;

    background:#fff;

    border-top:1px solid #e7e7e7;

    box-shadow:
        0 -2px 8px rgba(0,0,0,.07);

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    z-index:90;

    padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
    min-width:0;

    border:0;

    background:transparent;

    color:#777;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:12px;
    font-weight:400;

    overflow:hidden;
}

.nav-item .icon{
    width:27px;
    height:27px;
}

.nav-item span{
    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:100%;
}

.nav-item.active{
    color:#df9849;
}

/* =====================================================
   DRAWER
===================================================== */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.34);

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:opacity .25s ease;
}

.overlay.open{
    opacity:1;

    pointer-events:auto;
}

.drawer{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:min(560px,80vw);

    background:#fff;

    z-index:110;

    transform:translateX(-105%);

    transition:transform .28s ease;

    box-shadow:5px 0 20px rgba(0,0,0,.2);

    overflow-x:hidden;
    overflow-y:auto;
}

.drawer.open{
    transform:translateX(0);
}

.drawer-profile{
    width:100%;

    min-height:323px;

    padding:34px 20px 25px;

    border:0;

    background:var(--gradient);

    text-align:center;

    display:block;

    overflow:hidden;
}

.drawer-photo{
    display:block;

    width:126px;
    height:126px;

    margin:0 auto;

    object-fit:cover;

    border-radius:50%;

    border:4px solid #fff;

    box-shadow:0 3px 11px rgba(0,0,0,.22);
}

.drawer-profile h2{
    margin-top:12px;

    color:#111;

    font-size:24px;
    line-height:1.25;

    font-weight:500;
}

.drawer-profile .reg{
    margin-top:5px;

    color:#222;

    font-size:18px;
    font-weight:400;
}

.drawer-profile .program{
    margin:9px auto 0;

    max-width:340px;

    color:#222;

    font-size:15px;
    line-height:1.45;

    font-weight:400;
}

.drawer-search{
    padding:16px 18px 9px;

    background:#fff;
}

.search-box{
    width:100%;

    height:50px;

    display:flex;
    align-items:center;

    gap:9px;

    padding:0 13px;

    border-radius:15px;

    background:#eeeeee;
}

.search-box .icon{
    width:24px;
    height:24px;

    color:#555;
}

.search-box input{
    min-width:0;
    width:100%;

    border:0;
    background:transparent;

    color:#444;

    font-size:17px;
    font-weight:400;
}

.search-box input::placeholder{
    color:#777;
}

.drawer-list{
    width:100%;
}

.drawer-item{
    width:100%;
    min-height:68px;

    border:0;
    border-bottom:1px solid #ececec;

    background:#fff;

    display:flex;
    align-items:center;

    gap:22px;

    padding:10px 19px;

    color:#666;

    text-align:left;

    font-size:15px;
    line-height:1.4;
    font-weight:400;
}

.drawer-item .icon{
    flex:0 0 28px;

    width:28px;
    height:28px;

    color:#555;
}

.drawer-item span{
    min-width:0;
}

.drawer-logout{
    width:calc(100% - 28px);

    min-height:55px;

    margin:15px 14px 25px;

    border:0;

    border-radius:28px;

    background:var(--gradient);

    color:#222;

    font-size:17px;
    font-weight:400;

    box-shadow:0 4px 9px rgba(0,0,0,.13);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-topbar{
    width:100%;

    height:64px;

    background:#303030;

    color:#fff;

    display:grid;

    grid-template-columns:50px minmax(0,1fr) 72px;

    align-items:center;

    padding:0 10px;

    position:sticky;

    top:0;

    z-index:60;
}

.profile-topbar-title{
    text-align:center;

    font-size:22px;
    font-weight:400;
}

.profile-topbar .back{
    width:44px;
    height:44px;

    border:0;
    background:transparent;

    color:#fff;

    display:grid;
    place-items:center;
}

.qr-top{
    width:68px;
    height:50px;

    border:0;

    border-radius:8px;

    background:#ff821c;

    color:#fff;

    font-size:19px;
    font-weight:400;
}

.profile-wrapper{
    width:100%;

    padding:14px 24px 30px;
}

.profile-card{
    width:100%;

    background:#fff;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.profile-hero{
    width:100%;

    background:var(--gradient);

    padding:34px 20px 30px;

    text-align:center;
}

.profile-photo{
    width:min(225px,52vw);
    height:min(225px,52vw);

    object-fit:cover;

    border-radius:18px;

    background:#fff;
}

.profile-name{
    margin-top:8px;

    color:#222;

    font-size:23px;
    font-weight:500;
}

.profile-program{
    margin-top:5px;

    color:#222;

    font-size:17px;
    line-height:1.45;

    font-weight:400;
}

.dark-heading{
    width:100%;

    padding:15px 12px;

    background:#303030;

    color:#fff;

    text-align:center;

    font-size:20px;
    font-weight:400;
}

.profile-row{
    padding:16px 36px 3px;
}

.profile-label{
    color:#666;

    font-size:17px;
    line-height:1.3;

    font-weight:500;
}

.profile-value{
    margin-top:4px;

    color:#777;

    font-size:17px;
    line-height:1.55;

    font-weight:400;

    overflow-wrap:anywhere;
}

/* =====================================================
   MESS
===================================================== */

.mess-topbar{
    height:64px;

    background:#303030;

    color:#fff;

    display:grid;

    grid-template-columns:50px minmax(0,1fr) auto;

    align-items:center;

    gap:5px;

    padding:0 10px;

    position:sticky;

    top:0;

    z-index:60;
}

.mess-topbar-title{
    text-align:center;

    font-size:20px;
    font-weight:400;

    white-space:nowrap;
}

.mess-history-btn{
    border:0;

    background:transparent;

    color:#fff;

    font-size:17px;
    font-weight:400;

    white-space:nowrap;
}

.mess-card{
    width:100%;

    background:var(--gradient);

    border-radius:0 0 10px 10px;

    padding:35px 36px 28px;
}

.mess-photo{
    width:min(225px,55vw);
    height:min(225px,55vw);

    display:block;

    margin:0 auto;

    object-fit:cover;

    border-radius:18px;
}

.mess-name{
    margin:7px 0 31px;

    text-align:center;

    color:#222;

    font-size:22px;
    font-weight:500;
}

.mess-info{
    margin-bottom:17px;

    color:#222;

    font-size:16px;
    line-height:1.45;

    overflow-wrap:anywhere;
}

.mess-info strong{
    display:block;

    margin-bottom:2px;

    font-weight:500;
}

.mess-content{
    background:#fff;

    padding-bottom:40px;
}

.mess-instruction{
    padding:57px 20px 18px;

    text-align:center;

    color:#111;

    font-size:26px;
    line-height:1.4;

    font-weight:300;
}

.rate-btn{
    display:block;

    margin:0 auto 27px;

    padding:3px 16px;

    border:3px solid #8d1717;

    border-radius:18px;

    background:#fff;

    color:#222;

    font-size:16px;
    font-weight:400;
}

.meal-grid{
    width:100%;
    max-width:560px;

    margin:0 auto;

    padding:0 20px;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;
}

.meal-btn{
    min-width:0;

    min-height:76px;

    border:0;

    border-radius:9px;

    background:var(--gradient);

    color:#333;

    font-size:18px;
    font-weight:400;

    box-shadow:0 4px 9px rgba(0,0,0,.14);
}

/* =====================================================
   DATA PAGES
===================================================== */

.data-content{
    padding:25px 24px 30px;
}

.data-card{
    width:100%;

    background:#fff;

    border-radius:13px;

    padding:21px;

    margin-bottom:17px;

    box-shadow:var(--shadow);
}

.data-card h3{
    color:#222;

    font-size:18px;
    font-weight:500;
}

.data-card p{
    margin-top:5px;

    color:#777;

    font-size:14px;

    line-height:1.5;
}

.progress{
    width:100%;

    height:11px;

    margin-top:12px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    height:100%;

    background:var(--gradient);

    border-radius:20px;
}

.stat-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.stat-box{
    min-width:0;

    padding:18px 10px;

    border-radius:12px;

    background:var(--gradient);

    text-align:center;
}

.stat-box strong{
    display:block;

    color:#222;

    font-size:28px;
    font-weight:500;
}

.stat-box span{
    color:#444;

    font-size:12px;
}

.history-card{
    background:#fff;

    border-radius:12px;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.history-item{
    min-width:0;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    padding:16px 18px;

    border-bottom:1px solid #eee;
}

.history-item:last-child{
    border-bottom:0;
}

.history-item strong{
    color:#333;

    font-size:15px;
    font-weight:500;
}

.history-item div{
    font-size:13px;
}

.success{
    flex:0 0 auto;

    color:#4a985e;

    font-size:13px;
}

/* =====================================================
   MODALS
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:200;

    background:rgba(0,0,0,.48);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);

    max-height:90vh;

    overflow-y:auto;

    background:#fff;

    border-radius:17px;

    padding:23px;

    box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.modal-title{
    margin-bottom:15px;

    color:#222;

    font-size:21px;
    font-weight:400;
}

.modal-actions{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-top:18px;
}

.primary-btn,
.secondary-btn{
    min-height:49px;

    border-radius:10px;

    font-size:15px;
    font-weight:400;
}

.primary-btn{
    border:0;

    background:var(--gradient);

    color:#222;

    box-shadow:0 4px 8px rgba(0,0,0,.13);
}

.secondary-btn{
    border:1px solid #ddd;

    background:#fff;

    color:#555;
}

.scanner{
    width:min(255px,70vw);
    height:min(255px,70vw);

    margin:20px auto;

    border:4px solid var(--coral);

    position:relative;

    background:#fff;
}

.scanner::before,
.scanner::after{
    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-color:#222;
}

.scanner::before{
    left:-4px;
    top:-4px;

    border-left:5px solid;
    border-top:5px solid;
}

.scanner::after{
    right:-4px;
    bottom:-4px;

    border-right:5px solid;
    border-bottom:5px solid;
}

.qr-pattern{
    width:185px;
    height:185px;

    margin:33px auto;

    display:grid;

    grid-template-columns:
        repeat(15,minmax(0,1fr));

    background:#fff;
}

.qr-cell{
    border:.5px solid #222;
}

/* =====================================================
   SETUP
===================================================== */

.setup-page{
    min-height:100vh;

    padding:30px 16px 45px;

    background:#fafafa;
}

.setup-container{
    width:min(700px,100%);

    margin:auto;
}

.setup-brand{
    text-align:center;

    margin-bottom:24px;
}

.setup-brand h1{
    color:#222;

    font-size:30px;
    font-weight:500;
}

.setup-brand p{
    margin-top:5px;

    color:#777;

    font-size:13px;
}

.setup-card{
    width:100%;

    background:#fff;

    border-radius:18px;

    box-shadow:var(--shadow);

    overflow:hidden;
}

.setup-header{
    padding:28px 20px;

    text-align:center;

    background:var(--gradient);
}

.setup-header h2{
    color:#222;

    font-size:23px;
    font-weight:500;
}

.setup-header p{
    margin-top:4px;

    color:#444;

    font-size:13px;
}

.setup-body{
    padding:22px;
}

.photo-picker{
    text-align:center;

    margin-bottom:23px;
}

.photo-preview,
.photo-placeholder{
    width:120px;
    height:120px;

    margin:auto;

    border-radius:50%;
}

<body>

<div id="app"></div>

<div class="modal" id="modal">
    <div class="modal-box" id="modalContent"></div>
</div>

<script>

/* =====================================================
   SVG ICONS
===================================================== */

const I={

menu:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16"/>
</svg>`,

bell:`<svg class="icon" viewBox="0 0 24 24">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>`,

search:`<svg class="icon" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7"/>
<path d="m20 20-4-4"/>
</svg>`,

check:`<svg class="icon" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="m8 12 3 3 5-6"/>
</svg>`,

document:`<svg class="icon" viewBox="0 0 24 24">
<path d="M6 2h9l4 4v16H6z"/>
<path d="M14 2v5h5M9 12h6M9 16h6"/>
</svg>`,

book:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 5a3 3 0 0 1 3-3h13v17H7a3 3 0 0 0-3 3z"/>
<path d="M4 5v17M7 19h13"/>
</svg>`,

chart:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 19V5M4 19h17"/>
<path d="m8 15 3-4 3 2 5-7"/>
</svg>`,

calendar:`<svg class="icon" viewBox="0 0 24 24">
<rect x="3" y="4" width="18" height="17" rx="2"/>
<path d="M16 2v4M8 2v4M3 10h18"/>
</svg>`,

qr:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/>
<path d="M14 14h3v3h-3zM18 18h2M14 20h3"/>
</svg>`,

hostel:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 20V8l8-5 8 5v12"/>
<path d="M8 20v-6h8v6M9 9h2M13 9h2"/>
</svg>`,

doctor:`<svg class="icon" viewBox="0 0 24 24">
<path d="M8 3v6a4 4 0 0 0 8 0V3"/>
<path d="M6 3h4M14 3h4M12 13v4"/>
<circle cx="12" cy="19" r="3"/>
</svg>`,

truck:`<svg class="icon" viewBox="0 0 24 24">
<path d="M3 6h11v11H3zM14 10h4l3 3v4h-7"/>
<circle cx="7" cy="19" r="2"/>
<circle cx="18" cy="19" r="2"/>
</svg>`,

logout:`<svg class="icon" viewBox="0 0 24 24">
<path d="M10 17l5-5-5-5M15 12H3"/>
<path d="M21 19V5a2 2 0 0 0-2-2h-5"/>
</svg>`,

back:`<svg class="icon" viewBox="0 0 24 24">
<path d="m15 18-6-6 6-6"/>
</svg>`,

close:`<svg class="icon" viewBox="0 0 24 24">
<path d="M6 6l12 12M18 6 6 18"/>
</svg>`
};


/* =====================================================
   DATA
===================================================== */

const DEFAULT_TILES=[
    ["announce","Announce","document","0"],
    ["edu","Edu Revolution","book","0"],
    ["fee","Fee Statement","document",""],
    ["attendance","Attendance","check","100 %"],
    ["assignment","Assignment","document","0"],
    ["results","Results","chart","8.69"],
    ["exams","Exams","document","0"],
    ["rms","RMS Status","calendar",""],
    ["events","Events","calendar",""],
    ["marks","View Marks","qr","X"],
    ["leave","Hostel Leave Slip","qr","X"],
    ["makeup","Make Up Adjustment","qr","X"],
    ["mess","Mess Food Scanner","qr","X"],
    ["laundry","Laundry","qr","X"],
    ["report","Report Card","qr","X"],
    ["timetable","Time table","qr","X"],
    ["entry","Entry Exit Logs","qr","X"]
];

const CLASSES=[
    ["CSE330","36-804","09:30–10:20 AM"],
    ["CSE330","36-804","10:20–11:10 AM"],
    ["MAT301","36-802","11:10–12:00 PM"],
    ["CSE302","36-805","12:00–12:50 PM"]
];

const ATT=[
    ["CSE330",92],
    ["MAT301",85],
    ["CSE302",88],
    ["CSE304",86]
];


/* =====================================================
   STATE
===================================================== */

let profile=JSON.parse(
    localStorage.getItem("studentProfile")||"null"
);

let visibleTiles=JSON.parse(
    localStorage.getItem("visibleTiles")||
    JSON.stringify(DEFAULT_TILES.map(x=>x[0]))
);

let history=JSON.parse(
    localStorage.getItem("mealHistory")||"[]"
);

let currentPage="dashboard";


/* =====================================================
   HELPERS
===================================================== */

function esc(v){
    return String(v??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function saveProfile(){
    localStorage.setItem(
        "studentProfile",
        JSON.stringify(profile)
    );
}

function saveTiles(){
    localStorage.setItem(
        "visibleTiles",
        JSON.stringify(visibleTiles)
    );
}

function saveHistory(){
    localStorage.setItem(
        "mealHistory",
        JSON.stringify(history)
    );
}

function getTile(id){
    return DEFAULT_TILES.find(x=>x[0]===id);
}

function profileImage(cls){
    if(profile?.photo){
        return `<img class="${cls}" src="${profile.photo}">`;
    }

    return `
        <div class="${cls}"
        style="
        background:#eee;
        display:grid;
        place-items:center;
        color:#999;
        font-size:12px;
        ">
        PHOTO
        </div>
    `;
}


/* =====================================================
   SETUP
===================================================== */

function setup(){

    document.getElementById("app").innerHTML=`

    <div class="setup-page">

        <div class="setup-container">

            <div class="setup-brand">
                <h1>Student ERP</h1>
                <p>Complete your student profile</p>
            </div>

            <div class="setup-card">

                <div class="setup-header">
                    <h2>Student Details</h2>
                    <p>These details will be saved locally on this device.</p>
                </div>

                <div class="setup-body">

                    <div class="photo-picker">

                        <div id="photoPreview">
                            <div class="photo-placeholder">
                                Choose Photo
                            </div>
                        </div>

                        <input
                            id="photoInput"
                            type="file"
                            accept="image/*"
                            hidden
                        >

                        <button
                            type="button"
                            class="photo-btn"
                            onclick="
                            document.getElementById('photoInput').click()
                            "
                        >
                            Choose Profile Photo
                        </button>

                    </div>

                    <form id="setupForm">

                        <div class="form-grid">

                            ${field("Full Name","name","",true)}
                            ${field("Registration Number","registration","",true)}

                            ${field("Father's Name","father")}
                            ${field("Mother's Name","mother")}

                            ${field("Contact Number","contact")}
                            ${field("Email","email","","","email")}

                            ${field("Date Of Birth","dob","","","date")}

                            <div class="form-group">
                                <label>Gender</label>
                                <select name="gender">
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            ${area("Permanent Address","address")}
                            ${area("Correspondence Address","correspondence")}

                            ${field(
                                "Program",
                                "program",
                                "P132:B.Tech. (Computer Science and Engineering) (2024)"
                            )}

                            ${field("Admission Session","session","2024-1")}
                            ${field("Batch","batch","2024")}
                            ${field("Section","section","K2P24OF")}
                            ${field("Hostel","hostel","Boys Studios 13")}
                            ${field("Room / Bed","room","B227 - Bed A")}

                        </div>

                        <button class="primary-btn setup-submit">
                            Continue to Dashboard →
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
    `;

    let selectedPhoto="";

    document.getElementById("photoInput").onchange=e=>{

        const file=e.target.files[0];

        if(!file)return;

        const reader=new FileReader();

        reader.onload=event=>{

            selectedPhoto=event.target.result;

            document.getElementById("photoPreview").innerHTML=
            `<img
                class="photo-preview"
                src="${selectedPhoto}"
            >`;

        };

        reader.readAsDataURL(file);
    };


    document.getElementById("setupForm").onsubmit=e=>{

        e.preventDefault();

        const f=new FormData(e.target);

        profile={
            name:f.get("name"),
            registration:f.get("registration"),
            father:f.get("father"),
            mother:f.get("mother"),
            contact:f.get("contact"),
            email:f.get("email"),
            dob:f.get("dob"),
            gender:f.get("gender"),
            address:f.get("address"),
            correspondence:f.get("correspondence"),
            program:f.get("program"),
            session:f.get("session"),
            batch:f.get("batch"),
            section:f.get("section"),
            hostel:f.get("hostel"),
            room:f.get("room"),
            photo:selectedPhoto
        };

        saveProfile();

        dashboard();
    };
}

function field(label,name,value="",required=false,type="text"){

    return `
        <div class="form-group">
            <label>${label}</label>
            <input
                type="${type}"
                name="${name}"
                value="${esc(value)}"
                ${required?"required":""}
            >
        </div>
    `;
}

function area(label,name){

    return `
        <div class="form-group full">
            <label>${label}</label>
            <textarea name="${name}"></textarea>
        </div>
    `;
}


/* =====================================================
   SHELL
===================================================== */

function shell(content,active="dashboard"){

    return `

    <div class="page">

        <header class="topbar">

            <button
                class="topbar-btn"
                onclick="openDrawer()"
            >
                ${I.menu}
            </button>

            <div class="topbar-title">
                ${title(currentPage)}
            </div>

            <button
                class="topbar-btn"
                onclick="notifications()"
            >
                ${I.bell}
                <span class="notification-badge">19</span>
            </button>

        </header>

        ${content}

    </div>

    ${bottom(active)}

    ${drawer()}

    `;
}

function title(p){

    return {
        dashboard:"Dashboard",
        attendance:"Attendance",
        results:"Results",
        exams:"Exams",
        assignments:"Assignments",
        timetable:"Time table"
    }[p]||"Dashboard";
}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboard(){

    currentPage="dashboard";

    const cards=visibleTiles
        .map(getTile)
        .filter(Boolean);

    const content=`

    <main class="page-content">

        <section class="timetable-section">

            <h2 class="section-title">
                Today's Timetable
            </h2>

            <div class="timetable-scroll">

                ${CLASSES.map(c=>`

                    <div class="timetable-card">

                        <div class="course-code">
                            ${c[0]}
                        </div>

                        <div class="room">
                            ${c[1]}
                        </div>

                        <div class="status-pill">
                            <span class="status-dot"></span>
                            Upcoming
                        </div>

                        <div class="time-strip">
                            ${c[2]}
                        </div>

                    </div>

                `).join("")}

            </div>

        </section>


        <section class="add-tiles">

            <div class="tiles-heading">

                <h2>Add More Tiles</h2>

                <p>
                    Click on the plus button to add menu grids.
                </p>

                <button
                    class="add-chip"
                    style="margin-top:9px"
                    onclick="toggleAddTiles()"
                >
                    + Add Tiles
                </button>

                <div
                    id="addTileMenu"
                    class="add-tile-menu hidden"
                ></div>

            </div>

        </section>


        <section class="tile-grid">

            ${cards.map(tile).join("")}

        </section>

    </main>
    `;

    document.getElementById("app").innerHTML=
        shell(content,"dashboard");
}

function tile(t){

    const id=t[0];
    const name=t[1];
    const icon=t[2];
    const badge=t[3];

    const removable=badge==="X";

    return `

    <div class="tile">

        ${
            removable

            ?

            `<button
                class="tile-remove"
                onclick="removeTile('${id}')"
            >×</button>`

            :

            badge

            ?

            `<div class="tile-badge">
                ${badge}
            </div>`

            :""
        }

        <div class="tile-icon">
            ${I[icon]}
        </div>

        <button
            class="tile-label"
            onclick="tileClick('${id}')"
        >
            ${name}
        </button>

    </div>
    `;
}

function tileClick(id){

    if(id==="attendance")return attendancePage();
    if(id==="results")return resultsPage();
    if(id==="exams")return examsPage();
    if(id==="assignment")return assignmentsPage();
    if(id==="timetable")return timetablePage();
    if(id==="mess")return messPage();

    simplePage(
        getTile(id)?.[1]||"Module",
        "This module is available in the student ERP prototype."
    );
}

function removeTile(id){

    visibleTiles=visibleTiles.filter(x=>x!==id);

    saveTiles();

    dashboard();
}

function toggleAddTiles(){

    const el=document.getElementById("addTileMenu");

    if(!el)return;

    if(!el.classList.contains("hidden")){
        el.classList.add("hidden");
        return;
    }

    const available=DEFAULT_TILES.filter(
        x=>!visibleTiles.includes(x[0])
    );

    el.innerHTML=available.length

    ?

    available.map(x=>`
        <button
            class="add-chip"
            onclick="addTile('${x[0]}')"
        >
            + ${x[1]}
        </button>
    `).join("")

    :

    `<span style="font-size:12px;color:#777">
        All tiles are visible.
    </span>`;

    el.classList.remove("hidden");
}

function addTile(id){

    if(!visibleTiles.includes(id)){
        visibleTiles.push(id);
        saveTiles();
    }

    dashboard();
}


/* =====================================================
   BOTTOM NAV
===================================================== */

function bottom(active){

    return `

    <nav class="bottom-nav">

        <button
            class="nav-item ${active==="dashboard"?"active":""}"
            onclick="dashboard()"
        >
            ${I.calendar}
            <span>Dashboard</span>
        </button>

        <button
            class="nav-item"
            onclick="
            simplePage(
                'Happenings',
                'Latest campus announcements and activities.'
            )
            "
        >
            ${I.document}
            <span>Happenings</span>
        </button>

        <button
            class="nav-item"
            onclick="
            simplePage(
                'RMS',
                'RMS status and academic information.'
            )
            "
        >
            ${I.book}
            <span>RMS</span>
        </button>

        <button
            class="nav-item"
            onclick="
            simplePage(
                'Guest Room',
                'Guest room and visitor information.'
            )
            "
        >
            ${I.hostel}
            <span>Guest Room</span>
        </button>

    </nav>
    `;
}


/* =====================================================
   DRAWER
===================================================== */

function drawer(){

    const items=[

        ["Attendance",I.check,"attendancePage()"],
        ["Placement Barcode Scanner",I.qr,"simplePage('Placement Barcode Scanner','Scan placement barcode here.')"],
        ["Book Appointment",I.calendar,"simplePage('Book Appointment','Book an appointment.')"],
        ["Transport Preference",I.truck,"simplePage('Transport Preference','Manage transport preferences.')"],
        ["Change UMS Password",I.logout,"simplePage('Change UMS Password','Change your UMS password.')"],
        ["View Marks",I.document,"simplePage('View Marks','View academic marks.')"],
        ["Event Attendance",I.calendar,"simplePage('Event Attendance','View event attendance.')"],
        ["Doctor Appointment",I.doctor,"simplePage('Doctor Appointment','Book a doctor appointment.')"],
        ["Document Upload",I.document,"simplePage('Document Upload','Upload documents.')"],
        ["Mess Food Scanner",I.qr,"messPage()"]

    ];

    return `

    <div
        id="overlay"
        class="overlay"
        onclick="closeDrawer()"
    ></div>

    <aside
        id="drawer"
        class="drawer"
    >

        <button
            style="
            position:absolute;
            top:8px;
            right:8px;
            z-index:5;
            border:0;
            background:transparent;
            "
            onclick="closeDrawer()"
        >
            ${I.close}
        </button>


        <button
            class="drawer-profile"
            onclick="
            closeDrawer();
            profilePage();
            "
        >

            ${profileImage("drawer-photo")}

            <h2>
                ${esc(profile?.name)}
            </h2>

            <div class="reg">
                ${esc(profile?.registration)}
            </div>

            <div class="program">
                ${esc(profile?.program)}
            </div>

        </button>


        <div class="drawer-search">

            <div class="search-box">

                ${I.search}

function openDrawer(){

    document.getElementById("drawer")
        ?.classList.add("open");

    document.getElementById("overlay")
        ?.classList.add("open");
}

function closeDrawer(){

    document.getElementById("drawer")
        ?.classList.remove("open");

    document.getElementById("overlay")
        ?.classList.remove("open");
}

function drawerSearch(q){

    q=q.toLowerCase().trim();

    document
        .querySelectorAll(".drawer-search-item")
        .forEach(el=>{

            el.style.display=
                !q ||
                el.dataset.name.includes(q)
                ? "flex"
                : "none";

        });
}

function generateQR(id){

    const box=document.getElementById(id);

    if(!box)return;

    box.innerHTML="";

    for(let i=0;i<225;i++){

        const c=document.createElement("div");

        if(
            Math.random()>.55 ||
            i<45 ||
            i%15<3
        ){
            c.style.background="#222";
        }

        c.className="qr-cell";

        box.appendChild(c);
    }
}

function mealSuccess(meal){

    const d=new Date();

    history.push({

        meal,

        date:d.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        ),

        time:d.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
