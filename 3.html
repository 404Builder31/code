<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>a garden that never dies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#211730;
    --plum-deep:#150e1f;
    --coral:#ff9376;
    --gold:#ffd9a0;
    --sage:#3d6349;
    --sage-deep:#24402e;
    --rose:#e88aa0;
    --cream:#fff6ea;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--plum-deep);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;}

  /* ---------- intro ---------- */
  #intro{
    position:fixed;inset:0;z-index:50;
    background:#050208;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 2.2s ease, background 2.2s ease;
  }
  #intro.hide{opacity:0;pointer-events:none;}
  #introText{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    color:var(--cream);
    font-size:clamp(20px,3.4vw,40px);
    letter-spacing:0.5px;
    text-align:center;
    max-width:80vw;
    line-height:1.5;
    text-shadow:0 0 30px rgba(255,217,160,0.25);
    opacity:0;
    transition:opacity 1.1s ease;
  }
  #introText.show{opacity:1;}
  #introCursor{
    display:inline-block;width:2px;height:1em;
    background:var(--gold);
    vertical-align:-0.15em;
    margin-left:2px;
    animation:blink 0.9s steps(1) infinite;
  }
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  /* ---------- seed / flash ---------- */
  #seedFlash{
    position:fixed;inset:0;z-index:45;pointer-events:none;
    background:radial-gradient(circle at 50% 62%, rgba(255,224,160,0.95) 0%, rgba(255,190,130,0.35) 18%, rgba(0,0,0,0) 55%);
    opacity:0;
  }

  /* ---------- overlay UI ---------- */
  #ui{position:fixed;inset:0;z-index:30;pointer-events:none;}
  #hint{
    position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    color:rgba(255,246,234,0.75);
    font-size:13px;letter-spacing:0.12em;text-transform:uppercase;font-weight:300;
    opacity:0;transition:opacity 1.4s ease;
    text-align:center;
  }
  #hint.show{opacity:1;}

  /* ---------- cinematic messages ---------- */
  #messageLayer{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .msg{
    position:absolute;
    font-family:'Caveat',cursive;
    color:var(--cream);
    font-size:clamp(28px,5vw,58px);
    text-align:center;
    max-width:80vw;
    line-height:1.35;
    text-shadow:0 2px 24px rgba(0,0,0,0.45), 0 0 40px rgba(255,217,160,0.2);
    opacity:0;
    transform:translateY(18px);
    transition:opacity 2.2s ease, transform 2.2s ease;
  }
  .msg.show{opacity:1;transform:translateY(0);}
  .msg .accent{color:var(--rose);}

  /* ---------- fade to black + ending ---------- */
  #blackout{
    position:fixed;inset:0;z-index:60;background:#000;
    opacity:0;pointer-events:none;
    transition:opacity 3.5s ease;
  }
  #blackout.show{opacity:1;pointer-events:auto;}
  #finalScreen{
    position:fixed;inset:0;z-index:61;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    opacity:0;transition:opacity 2.5s ease;pointer-events:none;
  }
  #finalScreen.show{opacity:1;pointer-events:auto;}
  #finalScreen .line1{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
    color:rgba(255,246,234,0.55);font-size:clamp(16px,2vw,22px);
  }
  #finalScreen .line2{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
    color:var(--cream);font-size:clamp(26px,3.4vw,42px);text-align:center;padding:0 20px;
  }
  #replay{
    margin-top:10px;
    background:transparent;
    border:1px solid rgba(255,246,234,0.45);
    color:var(--cream);
    font-family:'Poppins',sans-serif;font-weight:300;font-size:13px;
    letter-spacing:0.14em;text-transform:uppercase;
    padding:13px 28px;border-radius:30px;cursor:pointer;
    transition:background 0.3s,transform 0.3s;
  }
  #replay:hover{background:rgba(255,246,234,0.12);transform:translateY(-2px);}

  @media (prefers-reduced-motion: reduce){
    #introText, .msg, #blackout, #finalScreen, #intro{transition-duration:0.4s;}
  }
</style>
</head>
<body>

<div id="stage"><canvas id="scene"></canvas></div>

<div id="intro">
  <div id="introText"><span id="introTextInner"></span><span id="introCursor"></span></div>
</div>
<div id="seedFlash"></div>

<div id="ui">
  <div id="hint">click anywhere to grow another flower</div>
</div>

<div id="messageLayer">
  <div class="msg" id="msg1">You asked for flowers&hellip;<br>so I made you one that <span class="accent">never dies</span>.</div>
  <div class="msg" id="msg2">Every flower here<br>was grown with <span class="accent">code</span>&mdash;<br>just for you.</div>
  <div class="msg" id="msg3">I hope this makes you <span class="accent">smile</span>.</div>
</div>

<div id="blackout"></div>
<div id="finalScreen">
  <div class="line1">Some people buy flowers.</div>
  <div class="line2">Developers grow them forever.</div>
  <button id="replay">plant it again</button>
</div>

<script>
(function(){
"use strict";

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   CANVAS + BASIC SETUP
============================================================ */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

function rand(a,b){return a + Math.random()*(b-a);}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function lerp(a,b,t){return a+(b-a)*t;}

function groundY(x){
  const base = H*0.86;
  return base + Math.sin(x*0.0022 + 1.4)*18 + Math.sin(x*0.006)*7;
}

/* ============================================================
   POINTER / WIND
============================================================ */
const pointer = {x:-9999,y:-9999,active:false, impulse:0};
function setPointer(x,y){pointer.x=x;pointer.y=y;pointer.active=true;pointer.impulse=1;}
window.addEventListener('mousemove', e=>setPointer(e.clientX,e.clientY));
window.addEventListener('touchmove', e=>{ if(e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
window.addEventListener('mouseleave', ()=>{pointer.active=false;});

let ambientWindPhase = 0;

/* ============================================================
   FLOWER DEFINITIONS
============================================================ */
const FLOWER_TYPES = [
  { name:'premiumRedRose', petals:14, shape:'layeredRose', petalLen:18, petalW:15, colors:['#e6193b','#c81f3f','#91091f'], center:'#4a0611', leaf:'#2f5a3a', h:[75,130] },
  { name:'premiumPinkRose', petals:14, shape:'layeredRose', petalLen:18, petalW:15, colors:['#ff75a0','#ff9ebb','#d64276'], center:'#9e2551', leaf:'#3d6b46', h:[75,130] },
  { name:'whiteRose',  petals:9,  shape:'round',   petalLen:14, petalW:11, colors:['#fdfaf4','#f3ecdd'],            center:'#e9c98f', leaf:'#3d6b46', h:[65,115] },
  { name:'tulip',      petals:6,  shape:'tulip',   petalLen:26, petalW:12, colors:['#e0294f','#f2b13a','#f5f0e6','#c94fb0'], center:'#5a3a1a', leaf:'#3a6b45', h:[80,130] },
  { name:'cherry',     petals:5,  shape:'notch',   petalLen:10, petalW:10, colors:['#ffd7e2','#ffc2d6','#ffe8ee'], center:'#e8879a', leaf:'#3d6b46', h:[50,90] },
  { name:'daisy',      petals:13, shape:'thin',    petalLen:16, petalW:5,  colors:['#fffdf6'],                      center:'#f2c14e', leaf:'#3f7048', h:[45,80] },
  { name:'hibiscus',   petals:5,  shape:'wide',    petalLen:24, petalW:20, colors:['#ff5a6e','#ff7a4d','#e6396b'], center:'#8a1030', leaf:'#2e5b3a', h:[70,110] },
  { name:'lavender',   petals:0,  shape:'spike',   petalLen:0,  petalW:0,  colors:['#8d7fd6','#a091e0','#7166c2'], center:'#7166c2', leaf:'#57705c', h:[55,95] },
  { name:'sunflower',  petals:16, shape:'thin',    petalLen:24, petalW:8,  colors:['#f6c343','#f7b52c'],            center:'#5c3a1a', leaf:'#3f7048', h:[110,170] },
  { name:'blueFlower', petals:6,  shape:'round',   petalLen:11, petalW:9,  colors:['#7ea8e0','#5f8fd6','#95bcec'], center:'#f2d98a', leaf:'#3d6b46', h:[40,75] },
  { name:'babysBreath',petals:0,  shape:'cluster', petalLen:3,  petalW:3,  colors:['#ffffff','#fbeef4'],          center:'#ffffff', leaf:'#5c7a5f', h:[45,80] },
  { name:'wildflower', petals:8,  shape:'thin',    petalLen:9,  petalW:4,  colors:['#f7a5c1','#f2e26b','#e78ad0','#a5d8f0'], center:'#e0a02a', leaf:'#4a7550', h:[35,65] },
];

let flowers = [];
let nextId = 0;

function makeFlower(x, opts){
  opts = opts || {};
  const type = opts.type || pick(FLOWER_TYPES);
  const gy = groundY(x);
  const height = rand(type.h[0], type.h[1]) * (opts.scale || 1);
  return {
    id: nextId++,
    x, groundY: gy,
    type,
    color: pick(type.colors),
    height,
    curveDir: Math.random()<0.5?-1:1,
    curveAmt: rand(6,26),
    baseTilt: rand(-0.06,0.06),
    swayPhase: rand(0,Math.PI*2),
    swaySpeed: rand(0.5,1.1),
    swayAmp: rand(0.03,0.09),
    petalCount: Math.max(4, Math.round(type.petals * rand(0.85,1.15))),
    petalRot: rand(0,Math.PI*2),
    headScale: rand(0.85,1.25),
    leafCount: (Math.random()<0.5)?1:2,
    leafSide: Math.random()<0.5?1:-1,
    startTime: performance.now() + (opts.delay||0),
    growDuration: opts.growDuration || rand(2600,4600),
    depth: opts.depth!==undefined ? opts.depth : rand(0,1),
  };
}

/* ============================================================
   PARTICLES: petals, fireflies, butterflies, clouds, birds
============================================================ */
const fallingPetals = [];
function spawnFallingPetal(){
  fallingPetals.push({
    x: rand(0,W), y: -20, r: rand(3,7),
    vx: rand(-0.25,0.25), vy: rand(0.35,0.9),
    rot: rand(0,Math.PI*2), vr: rand(-0.02,0.02),
    color: pick(['#f3a9c1','#ffd7e2','#fdfaf4','#f6c343', '#e6193b']),
    life:0, maxLife: rand(8000,16000)
  });
}

const fireflies = [];
for(let i=0;i<(reduceMotion?8:26);i++){
  fireflies.push({
    x:rand(0,W), y:rand(H*0.45,H*0.95),
    baseY: rand(H*0.45,H*0.95),
    phase:rand(0,Math.PI*2), speed:rand(0.4,1), r:rand(1.2,2.6),
    flick: rand(0,Math.PI*2)
  });
}

const butterflies = [];
for(let i=0;i<8;i++){
  butterflies.push({
    x:rand(0,W), y:rand(H*0.25,H*0.75),
    angle: rand(0,Math.PI*2),
    speed: rand(0.6,1.4),
    wingPhase: rand(0,10),
    color: pick(['#ff9376','#f2c14e','#e88aa0','#fdfaf4', '#5f8fd6', '#c94fb0']),
    turnT: rand(0,4),
    scale: rand(0.7, 1.3)
  });
}

const clouds = [];
for(let i=0;i<5;i++){
  clouds.push({ x:rand(0,W), y:rand(H*0.06,H*0.3), s:rand(0.6,1.4), speed:rand(3,8) });
}

const birds = [];
for(let i=0;i<6;i++){
  birds.push({
    x: rand(0,W), y: rand(H*0.08, H*0.35),
    speed: rand(1.5, 3), scale: rand(0.5, 1.1),
    wingPhase: rand(0, Math.PI*2)
  });
}

/* ============================================================
   STATE MACHINE
============================================================ */
let sceneState = 'intro';
let cascadeQueue = [];
let clickEnabled = false;

const introTextEl = document.getElementById('introTextInner');
const introTextWrap = document.getElementById('introText');
const introEl = document.getElementById('intro');
const seedFlashEl = document.getElementById('seedFlash');
const hintEl = document.getElementById('hint');

const introLines = [
  {text:'POV...', pause:900},
  {text:'She said...', pause:900},
  {text:'"I don\u2019t need expensive gifts."', pause:1500},
  {text:'"I just wanted flowers."', pause:2000},
  {text:'So I built her a garden.', pause:1800},
];

async function typeLine(str, speed){
  introTextWrap.classList.add('show');
  introTextEl.textContent='';
  for(let i=0;i<str.length;i++){
    introTextEl.textContent += str[i];
    await sleep(speed);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function runIntro(){
  for(const line of introLines){
    await typeLine(line.text, reduceMotion?8:38);
    await sleep(line.pause);
    introTextWrap.classList.remove('show');
    await sleep(650);
  }
  introEl.classList.add('hide');
  await sleep(1200);
  startSeed();
}

/* seed drop -> flash -> cascade */
let seed = null;
function startSeed(){
  sceneState='seed';
  seed = { x:W/2, y:-30, targetY: groundY(W/2)-6, vy:2 };
}

function triggerFlash(){
  seedFlashEl.style.transition='opacity 0.5s ease';
  seedFlashEl.style.opacity='1';
  setTimeout(()=>{
    seedFlashEl.style.transition='opacity 2.2s ease';
    seedFlashEl.style.opacity='0';
  }, 350);
  for(let i=0;i<40;i++) spawnRisingSpark();
  beginCascade();
}

const risingSparks=[];
function spawnRisingSpark(){
  risingSparks.push({
    x: W/2 + rand(-40,40), y: groundY(W/2),
    vx: rand(-0.6,0.6), vy: rand(-2.6,-1.2),
    life:0, maxLife: rand(1200,2400), r: rand(1,2.6)
  });
}

function beginCascade(){
  sceneState='growing';
  const count = reduceMotion?70:220; // Increased flower density
  for(let i=0;i<count;i++){
    const x = rand(0, W);
    const distFromCenter = Math.abs(x-W/2)/ (W/2);
    const delay = distFromCenter*1400 + rand(0,2600) + i*6;
    flowers.push(makeFlower(x, {delay, depth: rand(0,1), growDuration: rand(2400,4200)}));
  }
  flowers.sort((a,b)=>a.depth-b.depth);
  clickEnabled = true;
  setTimeout(()=>{
    sceneState='garden';
    hintEl.classList.add('show');
    scheduleMessages();
  }, 6200);
}

/* click / tap to plant */
function plantAt(x){
  if(!clickEnabled) return;
  const f = makeFlower(clamp(x,10,W-10), {delay:0, growDuration: rand(1800,3000), depth: rand(0.6,1)});
  flowers.push(f);
  flowers.sort((a,b)=>a.depth-b.depth); // Keep z-index sorting proper
  hintEl.classList.remove('show');
  clearTimeout(plantAt._t);
  plantAt._t = setTimeout(()=>{ if(sceneState==='garden') hintEl.classList.add('show'); }, 3200);
}
window.addEventListener('click', (e)=>{
  if(e.target.closest('#replay')) return;
  plantAt(e.clientX);
});
window.addEventListener('touchstart', (e)=>{
  if(e.target.closest('#replay')) return;
  const t = e.touches[0]; if(t) plantAt(t.clientX);
}, {passive:true});

/* messages sequence */
const msg1 = document.getElementById('msg1');
const msg2 = document.getElementById('msg2');
const msg3 = document.getElementById('msg3');
function scheduleMessages(){
  setTimeout(()=>msg1.classList.add('show'), 2500);
  setTimeout(()=>msg1.classList.remove('show'), 7200);
  setTimeout(()=>msg2.classList.add('show'), 8200);
  setTimeout(()=>msg2.classList.remove('show'), 12900);
  setTimeout(()=>msg3.classList.add('show'), 13900);
  setTimeout(()=>msg3.classList.remove('show'), 17600);
  setTimeout(()=>beginEnding(), 18800);
}

/* ending */
const blackoutEl = document.getElementById('blackout');
const finalEl = document.getElementById('finalScreen');
function beginEnding(){
  sceneState='ending';
  hintEl.classList.remove('show');
  const extra = reduceMotion?40:120;
  for(let i=0;i<extra;i++){
    const x = rand(0,W);
    flowers.push(makeFlower(x, {delay: i*20, growDuration: rand(1200,2200), depth: rand(0,1)}));
  }
  flowers.sort((a,b)=>a.depth-b.depth);
  setTimeout(()=>{
    blackoutEl.classList.add('show');
    setTimeout(()=>{ finalEl.classList.add('show'); sceneState='done'; }, 2600);
  }, 3600);
}
document.getElementById('replay').addEventListener('click', ()=>window.location.reload());

/* ============================================================
   DRAWING: SKY / MOUNTAINS / MIST / BIRDS
============================================================ */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#2a1d3d');
  g.addColorStop(0.32, '#6b3e56');
  g.addColorStop(0.58, '#ff9376');
  g.addColorStop(0.78, '#ffd9a0');
  g.addColorStop(1, '#fff3d9');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // sun
  const sunX = W*0.72, sunY = H*0.58;
  const sg = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,H*0.42);
  sg.addColorStop(0,'rgba(255,244,214,0.95)');
  sg.addColorStop(0.25,'rgba(255,217,160,0.55)');
  sg.addColorStop(1,'rgba(255,217,160,0)');
  ctx.fillStyle=sg;
  ctx.beginPath(); ctx.arc(sunX,sunY,H*0.42,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,250,235,0.9)';
  ctx.beginPath(); ctx.arc(sunX,sunY,H*0.045,0,Math.PI*2); ctx.fill();
}

function drawClouds(dt){
  ctx.save();
  for(const c of clouds){
    c.x += c.speed*dt*0.02;
    if(c.x > W+150) c.x = -150;
    ctx.globalAlpha = 0.35*c.s;
    ctx.fillStyle = '#ffe9d1';
    const y = c.y;
    for(let k=0;k<4;k++){
      ctx.beginPath();
      ctx.ellipse(c.x + k*34*c.s, y + Math.sin(k)*6, 40*c.s, 18*c.s, 0,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawBirds(dt){
  ctx.save();
  ctx.strokeStyle = '#2a1d3d'; // Silhouette matching the top sky gradient
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for(const b of birds){
    b.x += b.speed * dt * 0.05;
    if(b.x > W + 50) {
      b.x = -50;
      b.y = rand(H*0.08, H*0.35);
    }
    b.wingPhase += dt * 0.007 * b.speed;
    const flapY = Math.sin(b.wingPhase) * 12; // Wing flap intensity

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.scale, b.scale);
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(0, 0); // Center body
    ctx.quadraticCurveTo(-10, flapY - 8, -20, flapY); // Left wing
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(10, flapY - 8, 20, flapY); // Right wing
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawMountains(){
  ctx.save();
  ctx.fillStyle='rgba(90,60,90,0.35)';
  ctx.beginPath();
  ctx.moveTo(0,H*0.78);
  for(let x=0;x<=W;x+=40){
    ctx.lineTo(x, H*0.78 - Math.sin(x*0.004+1)*30 - 20);
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGroundBand(){
  const g = ctx.createLinearGradient(0,H*0.72,0,H);
  g.addColorStop(0,'rgba(61,99,73,0)');
  g.addColorStop(0.35,'#2f5138');
  g.addColorStop(1,'#1c3323');
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=20) ctx.lineTo(x, groundY(x));
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.restore();
}

function drawMist(time){
  ctx.save();
  ctx.globalAlpha=0.18;
  ctx.fillStyle='#ffffff';
  for(let i=0;i<3;i++){
    const y = H*0.82 + i*14;
    const shift = Math.sin(time*0.00008 + i)*60;
    ctx.beginPath();
    ctx.ellipse(W*0.5+shift, y, W*0.7, 26, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   FLOWER DRAWING
============================================================ */
function drawFlower(f, now, windAngleAt){
  const g = clamp((now - f.startTime)/f.growDuration, 0, 1);
  if(g<=0) return;
  const stemT = easeOutCubic(clamp(g/0.42,0,1));
  const leafT = clamp((g-0.12)/0.35,0,1);
  const bloomT = easeOutBack(clamp((g-0.42)/0.58,0,1));
  if(stemT<=0) return;

  const scale = lerp(0.55, 1, f.depth);
  const h = f.height*scale*stemT;
  const baseX = f.x, baseY = f.groundY;

  const sway = Math.sin(now*0.0011*f.swaySpeed + f.swayPhase) * f.swayAmp;
  const wind = windAngleAt(baseX) * (0.5 + 0.5*f.depth);
  const tilt = f.baseTilt + sway + wind;

  const topX = baseX + Math.sin(tilt)*h + f.curveDir*f.curveAmt*stemT*0.4;
  const topY = baseY - Math.cos(tilt)*h;
  const ctrlX = baseX + f.curveDir*f.curveAmt*stemT;
  const ctrlY = baseY - h*0.55;

  ctx.save();
  ctx.globalAlpha = lerp(0.55,1,f.depth);

  // stem
  ctx.strokeStyle = f.type.leaf;
  ctx.lineWidth = lerp(1.4,3.2,scale);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(ctrlX, ctrlY, topX, topY);
  ctx.stroke();

  // leaves
  if(leafT>0){
    for(let i=0;i<f.leafCount;i++){
      const lt = clamp(leafT - i*0.15, 0, 1);
      if(lt<=0) continue;
      const along = 0.35 + i*0.25;
      const px = lerp(lerp(baseX,ctrlX,along), lerp(ctrlX,topX,along), along);
      const py = lerp(lerp(baseY,ctrlY,along), lerp(ctrlY,topY,along), along);
      const side = (i%2===0? f.leafSide : -f.leafSide);
      const leafAng = tilt + side*1.1;
      const len = 14*scale*easeOutCubic(lt);
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(leafAng);
      ctx.fillStyle = f.type.leaf;
      ctx.beginPath();
      ctx.ellipse(len*0.5,0,len*0.5,len*0.28,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  // head
  if(bloomT>0){
    ctx.translate(topX, topY);
    ctx.rotate(tilt*0.4);
    const s = bloomT * scale * f.headScale;
    ctx.scale(s,s);
    drawHead(f);
  }
  ctx.restore();
}

function drawHead(f){
  const t = f.type;
  const petalRot = f.petalRot;
  switch(t.shape){
    case 'spike': {
      ctx.fillStyle = f.color;
      for(let i=0;i<9;i++){
        const yy = -i*3.4;
        const xx = Math.sin(i*1.3)*2.2;
        ctx.beginPath(); ctx.arc(xx,yy,2.6,0,Math.PI*2); ctx.fill();
      }
      break;
    }
    case 'cluster': {
      ctx.fillStyle = f.color;
      for(let i=0;i<7;i++){
        const a = (i/7)*Math.PI*2 + petalRot;
        const r = 6;
        ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, 2, 0, Math.PI*2); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
      break;
    }
    case 'tulip': {
      ctx.fillStyle = f.color;
      for(let i=-1;i<=1;i++){
        ctx.save();
        ctx.rotate(i*0.32);
        ctx.beginPath();
        ctx.moveTo(0,4);
        ctx.quadraticCurveTo(t.petalW, -t.petalLen*0.6, 0, -t.petalLen);
        ctx.quadraticCurveTo(-t.petalW, -t.petalLen*0.6, 0, 4);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = t.center;
      ctx.beginPath(); ctx.arc(0,-2,2.4,0,Math.PI*2); ctx.fill();
      break;
    }
    case 'layeredRose': {
      // Intricate layered drawing specifically for premium roses
      const layers = 3;
      for(let layer=layers; layer>0; layer--){
        const numLayerPetals = f.petalCount - (layers-layer)*3;
        const layerScale = layer/layers;
        for(let i=0; i<numLayerPetals; i++){
          const a = (i/numLayerPetals)*Math.PI*2 + petalRot + (layer*0.5);
          ctx.save();
          ctx.rotate(a);
          ctx.translate(0, -t.petalLen * 0.45 * layerScale);
          ctx.fillStyle = f.color;
          ctx.globalAlpha = 0.9 - (layers-layer)*0.1;
          ctx.beginPath();
          ctx.ellipse(0,0, t.petalW*0.6*layerScale, t.petalLen*0.55*layerScale, 0,0,Math.PI*2);
          ctx.fill();
          // Add a subtle darker outline to simulate petal folds
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.fillStyle = t.center;
      ctx.beginPath(); ctx.arc(0,0, Math.max(3, t.petalW*0.3), 0, Math.PI*2); ctx.fill();
      break;
    }
    default: {
      const n = f.petalCount;
      for(let i=0;i<n;i++){
        const a = (i/n)*Math.PI*2 + petalRot;
        ctx.save();
        ctx.rotate(a);
        ctx.translate(0, -t.petalLen*0.55);
        ctx.fillStyle = f.color;
        ctx.beginPath();
        if(t.shape==='thin'){
          ctx.ellipse(0,0, t.petalW*0.5, t.petalLen*0.55, 0,0,Math.PI*2);
        } else if(t.shape==='wide'){
          ctx.ellipse(0,0, t.petalW*0.6, t.petalLen*0.55, 0,0,Math.PI*2);
        } else if(t.shape==='notch'){
          ctx.moveTo(0,-t.petalLen*0.5);
          ctx.quadraticCurveTo(t.petalW*0.6, 0, 0, t.petalLen*0.55);
          ctx.quadraticCurveTo(-t.petalW*0.6, 0, 0, -t.petalLen*0.5);
        } else {
          ctx.ellipse(0,0, t.petalW*0.55, t.petalLen*0.55, 0,0,Math.PI*2);
        }
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = t.center;
      ctx.beginPath(); ctx.arc(0,0, Math.max(3, t.petalW*0.45), 0, Math.PI*2); ctx.fill();
    }
  }
}

/* wind angle field combining ambient sway + pointer repulsion */
function windAngleAt(x){
  let a = Math.sin(ambientWindPhase + x*0.004)*0.05;
  if(pointer.active){
    const dx = x - pointer.x;
    const dist = Math.max(30, Math.abs(dx));
    const influence = clamp(1 - dist/260, 0, 1);
    a += Math.sign(dx||1) * influence * 0.5 * pointer.impulse;
  }
  return a;
}

/* ============================================================
   MAIN LOOP
============================================================ */
let lastTime = performance.now();
function frame(now){
  const dt = Math.min(now-lastTime, 50); lastTime = now;
  ambientWindPhase += dt*0.0006;
  pointer.impulse *= 0.94;

  ctx.clearRect(0,0,W,H);
  drawSky();
  drawBirds(dt); // Added birds
  drawClouds(dt);
  drawMountains();

  // seed sequence rendering
  if(sceneState==='seed' && seed){
    seed.y += seed.vy*(dt*0.06);
    seed.vy += 0.02*(dt*0.06);
    ctx.save();
    ctx.fillStyle='rgba(255,224,160,0.95)';
    ctx.shadowColor='rgba(255,217,160,0.9)';
    ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(seed.x, seed.y, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    if(seed.y >= seed.targetY){
      sceneState='flash';
      triggerFlash();
    }
  }

  drawGroundBand();

  // flowers, back to front by depth
  for(const f of flowers){
    drawFlower(f, now, windAngleAt);
  }

  // rising sparks (seed flash)
  for(let i=risingSparks.length-1;i>=0;i--){
    const s = risingSparks[i];
    s.life += dt;
    s.x += s.vx*(dt*0.06);
    s.y += s.vy*(dt*0.06);
    s.vy += 0.001*dt;
    const a = 1 - s.life/s.maxLife;
    if(a<=0){ risingSparks.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0,a);
    ctx.fillStyle='#ffe9c2';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  drawMist(now);

  // falling petals
  if(!reduceMotion && sceneState!=='intro' && Math.random()<0.02) spawnFallingPetal();
  for(let i=fallingPetals.length-1;i>=0;i--){
    const p = fallingPetals[i];
    p.life += dt;
    p.x += (p.vx + Math.sin(now*0.001+p.rot)*0.3) * (dt*0.06);
    p.y += p.vy*(dt*0.06);
    p.rot += p.vr*dt*0.06;
    if(p.y > H+20 || p.life>p.maxLife){ fallingPetals.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha=0.85;
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.6,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // fireflies
  if(sceneState!=='intro'){
    for(const fl of fireflies){
      fl.phase += dt*0.0012*fl.speed;
      fl.flick += dt*0.006;
      fl.x += Math.sin(fl.phase*1.7)*0.4;
      fl.y = fl.baseY + Math.sin(fl.phase*2.3)*14;
      if(fl.x<-10) fl.x=W+10; if(fl.x>W+10) fl.x=-10;
      const glow = 0.4 + 0.6*Math.abs(Math.sin(fl.flick));
      ctx.save();
      ctx.globalAlpha = glow*0.85;
      ctx.fillStyle='#ffe9a8';
      ctx.shadowColor='#ffe9a8';
      ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(fl.x,fl.y,fl.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // enhanced realistic butterflies
  if(sceneState!=='intro'){
    for(const b of butterflies){
      b.turnT -= dt*0.001;
      if(b.turnT<=0){ b.angle += rand(-0.9,0.9); b.turnT = rand(1.5,4); }
      if(pointer.active){
        const dx = pointer.x-b.x, dy=pointer.y-b.y;
        const d = Math.hypot(dx,dy);
        if(d<180 && d>1){ b.angle = lerp(b.angle, Math.atan2(dy,dx), 0.02); }
      }
      b.x += Math.cos(b.angle)*b.speed*(dt*0.06);
      b.y += Math.sin(b.angle)*b.speed*(dt*0.06) + Math.sin(now*0.003)*0.3;
      if(b.x<-20) b.x=W+20; if(b.x>W+20) b.x=-20;
      if(b.y<20) b.y=20; if(b.y>H*0.75) b.y=H*0.75;

      b.wingPhase += dt*0.015 * b.speed;
      const wingFlap = Math.abs(Math.sin(b.wingPhase)) * 1.2;

      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.angle + Math.PI/2);
      ctx.scale(b.scale, b.scale);
      ctx.fillStyle = b.color;

      // Draw body
      ctx.fillStyle = '#211730';
      ctx.beginPath(); ctx.ellipse(0, 0, 1.5, 4, 0, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.9;

      // Left wings
      ctx.save();
      ctx.scale(Math.max(0.1, wingFlap), 1);
      ctx.beginPath();
      ctx.ellipse(-4, -3, 6, 8, Math.PI/6, 0, Math.PI*2); // Upper left wing
      ctx.ellipse(-3, 4, 4.5, 5, -Math.PI/6, 0, Math.PI*2); // Lower left wing
      ctx.fill();
      ctx.restore();

      // Right wings
      ctx.save();
      ctx.scale(Math.max(0.1, wingFlap), 1);
      ctx.beginPath();
      ctx.ellipse(4, -3, 6, 8, -Math.PI/6, 0, Math.PI*2); // Upper right wing
      ctx.ellipse(3, 4, 4.5, 5, Math.PI/6, 0, Math.PI*2); // Lower right wing
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }
  }

  // vignette
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(10,4,14,0.35)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
============================================================ */
requestAnimationFrame(frame);
setTimeout(runIntro, 700);

})();
</script>
</body>
