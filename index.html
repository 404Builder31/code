<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student ERP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --coral:#ff7f73;
  --peach:#ffad79;
  --yellow:#ffd36f;
  --dark:#303030;
  --text:#454545;
  --muted:#777;
  --cream:#fffaf0;
  --white:#fff;
  --bg:#f8f8f8;
  --shadow:0 5px 14px rgba(0,0,0,.13);
  --gradient:linear-gradient(90deg,#ff7f73,#ffad79,#ffd36f);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Poppins,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

/* =========================
   COMMON
========================= */

.gradient{
  background:var(--gradient);
}

.icon{
  width:25px;
  height:25px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.topbar{
  height:72px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-title{
  font-size:27px;
  font-weight:500;
  color:#222;
}

.topbar-btn{
  border:0;
  background:transparent;
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  position:relative;
  color:#333;
}

.notification-badge{
  position:absolute;
  right:0;
  top:2px;
  min-width:28px;
  height:28px;
  padding:0 6px;
  display:grid;
  place-items:center;
  background:var(--gradient);
  border-radius:9px;
  font-size:13px;
  color:#222;
  font-weight:600;
}

.page{
  min-height:100vh;
  padding-bottom:90px;
}

.page-content{
  max-width:1100px;
  margin:auto;
  padding:24px 28px;
}

.section-title{
  font-size:27px;
  color:#111;
  font-weight:400;
  margin:0 0 18px;
}

.card{
  background:white;
  border-radius:12px;
  box-shadow:var(--shadow);
}

.gradient-card{
  background:var(--gradient);
  border-radius:12px;
}

.primary-btn{
  border:0;
  background:var(--gradient);
  color:#222;
  border-radius:12px;
  min-height:52px;
  padding:0 25px;
  font-size:17px;
  font-weight:500;
  box-shadow:0 5px 10px rgba(0,0,0,.16);
}

.primary-btn:active{
  transform:scale(.98);
}

.back-btn{
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  width:45px;
  height:45px;
}

.empty{
  text-align:center;
  color:#888;
  padding:50px 20px;
}

/* =========================
   SETUP
========================= */

.setup-page{
  min-height:100vh;
  background:#fafafa;
  padding:30px 16px 50px;
}

.setup-container{
  width:min(720px,100%);
  margin:auto;
}

.setup-brand{
  text-align:center;
  margin-bottom:25px;
}

.setup-brand h1{
  margin:0;
  font-size:34px;
  font-weight:600;
  color:#222;
}

.setup-brand p{
  margin:5px 0 0;
  color:#777;
}

.setup-card{
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.setup-header{
  padding:30px 24px;
  text-align:center;
  background:var(--gradient);
}

.setup-header h2{
  margin:0;
  font-size:25px;
  color:#222;
}

.setup-header p{
  margin:6px 0 0;
  color:#444;
}

.setup-body{
  padding:25px;
}

.photo-picker{
  text-align:center;
  margin-bottom:25px;
}

.photo-preview{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  border:5px solid #fff;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.photo-placeholder{
  width:125px;
  height:125px;
  border-radius:50%;
  background:#eee;
  margin:auto;
  display:grid;
  place-items:center;
  color:#999;
  font-size:13px;
  border:4px solid white;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.photo-btn{
  margin-top:12px;
  border:0;
  background:var(--gradient);
  padding:10px 18px;
  border-radius:9px;
  font-size:14px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:14px;
  font-weight:500;
  color:#555;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #ddd;
  background:#fafafa;
  border-radius:10px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  color:#444;
}

.form-group textarea{
  min-height:85px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:var(--coral);
  background:white;
}

.setup-submit{
  width:100%;
  margin-top:24px;
}

/* =========================
   TIMETABLE
========================= */

.timetable-section{
  margin-bottom:35px;
}

.timetable-scroll{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:5px 4px 15px;
  scrollbar-width:none;
}

.timetable-scroll::-webkit-scrollbar{
  display:none;
}

.timetable-card{
  min-width:310px;
  height:236px;
  border-radius:12px;
  overflow:hidden;
  background:var(--gradient);
  box-shadow:var(--shadow);
  position:relative;
  flex-shrink:0;
  padding:26px;
}

.timetable-card:after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:45px;
  width:150px;
  height:100px;
  border:4px solid rgba(255,255,255,.2);
  border-radius:50%;
  transform:rotate(-20deg);
}

.course-code{
  font-size:27px;
  font-weight:600;
  color:#222;
}

.room{
  font-size:16px;
  margin-top:5px;
  color:#333;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#ffcf78;
  border-radius:20px;
  padding:7px 13px;
  margin-top:18px;
  color:#333;
  font-size:14px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ef7e24;
}

.time-strip{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:49px;
  background:#303030;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:500;
}

/* =========================
   DASHBOARD TILES
========================= */

.tiles-heading{
  margin-bottom:18px;
}

.tiles-heading h2{
  font-size:26px;
  margin:0;
  color:#111;
  font-weight:400;
}

.tiles-heading p{
  margin:6px 0 0;
  font-size:15px;
  color:#222;
}

.tile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.tile{
  min-height:250px;
  background:var(--cream);
  border:1px solid #e7e0d1;
  border-radius:14px;
  box-shadow:0 3px 8px rgba(0,0,0,.09);
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:28px 10px 14px;
}

.tile-icon{
  width:82px;
  height:82px;
  margin-bottom:18px;
  color:#303030;
}

.tile-icon svg{
  width:100%;
  height:100%;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.tile-label{
  background:#ffbd7b;
  border-radius:9px;
  color:#222;
  font-size:17px;
  padding:8px 14px;
  text-align:center;
  min-width:80%;
  line-height:1.3;
}

.tile-badge{
  position:absolute;
  right:-1px;
  top:-16px;
  min-width:45px;
  height:45px;
  padding:0 9px;
  border-radius:10px;
  background:var(--gradient);
  display:grid;
  place-items:center;
  font-size:15px;
  color:#222;
  font-weight:500;
}

.tile-remove{
  position:absolute;
  right:-1px;
  top:-16px;
  min-width:45px;
  height:45px;
  border:0;
  border-radius:10px;
  background:var(--gradient);
  font-size:20px;
  color:#222;
}

.add-tiles{
  margin:20px 0;
}

.add-tile-menu{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.add-chip{
  border:1px solid #ddd;
  background:white;
  border-radius:20px;
  padding:8px 14px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#fff;
  border-top:1px solid #eee;
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:80;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  flex:1;
  height:100%;
  border:0;
  background:transparent;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:12px;
}

.nav-item .icon{
  width:28px;
  height:28px;
}

.nav-item.active{
  color:#df9849;
}

/* =========================
   DRAWER
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.overlay.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(540px,82vw);
  background:#fff;
  z-index:110;
  transform:translateX(-105%);
  transition:.3s ease;
  box-shadow:5px 0 20px rgba(0,0,0,.2);
  overflow-y:auto;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-profile{
  background:var(--gradient);
  padding:38px 22px 30px;
  text-align:center;
}

.drawer-photo{
  width:142px;
  height:142px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.drawer-profile h2{
  margin:12px 0 2px;
  color:#111;
  font-size:27px;
  font-weight:500;
}

.drawer-profile .reg{
  font-size:21px;
  color:#222;
}

.drawer-profile .program{
  margin-top:8px;
  font-size:17px;
  line-height:1.5;
  color:#222;
}

.drawer-search{
  padding:18px 22px 10px;
}

.search-box{
  height:55px;
  background:#eee;
  border-radius:16px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
}

.search-box input{
  border:0;
  outline:0;
  background:transparent;
  flex:1;
  font-size:19px;
}

.drawer-list{
  padding-bottom:30px;
}

.drawer-item{
  width:100%;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:25px;
  padding:12px 20px;
  text-align:left;
  color:#666;
  font-size:17px;
}

.drawer-item .icon{
  width:28px;
  height:28px;
  color:#555;
}

.drawer-item:hover{
  background:#fafafa;
}

.drawer-logout{
  margin:12px 14px 24px;
  width:calc(100% - 28px);
  height:58px;
  border:0;
  background:var(--gradient);
  border-radius:30px;
  font-size:19px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

/* =========================
   PROFILE
========================= */

.dark-heading{
  background:#303030;
  color:white;
  text-align:center;
  padding:17px 15px;
  font-size:22px;
  font-weight:500;
}

.profile-card{
  background:white;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.profile-hero{
  background:var(--gradient);
  text-align:center;
  padding:38px 20px;
}

.profile-photo{
  width:225px;
  height:225px;
  object-fit:cover;
  border-radius:18px;
  background:#fff;
}

.profile-name{
  font-size:25px;
  color:#222;
  margin:8px 0 4px;
  font-weight:500;
}

.profile-program{
  font-size:18px;
  color:#222;
}

.profile-section{
  background:white;
}

.profile-row{
  padding:18px 36px 4px;
}

.profile-label{
  font-size:18px;
  font-weight:500;
  color:#666;
}

.profile-value{
  font-size:18px;
  color:#777;
  line-height:1.55;
  margin-bottom:12px;
}

.qr-top{
  width:90px;
  height:68px;
  background:#ff7d1b;
  border:0;
  border-radius:8px;
  color:white;
  font-size:22px;
}

/* =========================
   MESS
========================= */

.mess-card{
  background:var(--gradient);
  padding:35px 36px;
  border-radius:0 0 10px 10px;
}

.mess-photo{
  width:225px;
  height:225px;
  object-fit:cover;
  border-radius:18px;
  display:block;
  margin:auto;
}

.mess-name{
  text-align:center;
  font-size:25px;
  margin:8px 0 35px;
  color:#222;
  font-weight:500;
}

.mess-info{
  font-size:17px;
  line-height:1.5;
  color:#222;
  margin-bottom:18px;
}

.mess-info strong{
  display:block;
  font-weight:600;
}

.mess-instruction{
  text-align:center;
  font-size:29px;
  color:#111;
  line-height:1.4;
  padding:60px 20px 20px;
}

.rate-btn{
  display:block;
  margin:0 auto 28px;
  border:3px solid #8d1515;
  border-radius:20px;
  background:white;
  font-size:17px;
  padding:3px 18px;
}

.meal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  max-width:550px;
  margin:0 auto 45px;
  padding:0 20px;
}

.meal-btn{
  border:0;
  background:var(--gradient);
  border-radius:9px;
  min-height:85px;
  font-size:21px;
  color:#333;
  box-shadow:0 5px 10px rgba(0,0,0,.15);
}

/* =========================
   DATA PAGES
========================= */

.data-card{
  background:white;
  border-radius:15px;
  padding:25px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.data-card h3{
  margin:0 0 8px;
  font-size:20px;
  color:#222;
}

.data-card p{
  margin:4px 0;
  color:#666;
}

.progress{
  height:14px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 20px;
}

.progress-bar{
  height:100%;
  background:var(--gradient);
  border-radius:20px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.stat-box{
  padding:20px;
  border-radius:12px;
  background:var(--gradient);
  text-align:center;
}

.stat-box strong{
  display:block;
  font-size:30px;
}

.stat-box span{
  font-size:14px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px;
  border-bottom:1px solid #eee;
}

.history-item:last-child{
  border-bottom:0;
}

.success{
  color:#2f9a54;
  font-weight:600;
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.modal-title{
  font-size:23px;
  font-weight:500;
  margin:0 0 18px;
  color:#222;
}

.modal-actions{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

.secondary-btn{
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  min-height:50px;
  font-size:15px;
}

.scanner{
  width:260px;
  height:260px;
  border:4px solid var(--coral);
  margin:20px auto;
  position:relative;
  background:
    linear-gradient(90deg,transparent 48%,rgba(255,127,115,.15) 50%,transparent 52%),
    linear-gradient(0deg,transparent 48%,rgba(255,127,115,.15) 50%,transparent 52%);
}

.scanner:before,
.scanner:after{
  content:"";
  position:absolute;
  width:45px;
  height:45px;
  border-color:#222;
}

.scanner:before{
  left:-4px;
  top:-4px;
  border-left:5px solid;
  border-top:5px solid;
}

.scanner:after{
  right:-4px;
  bottom:-4px;
  border-right:5px solid;
  border-bottom:5px solid;
}

.qr-pattern{
  width:190px;
  height:190px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  background:white;
}

.qr-cell{
  border:1px solid #222;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:900px){
  .page-content{
    padding:30px 40px;
  }

  .bottom-nav{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:min(700px,100%);
    border-radius:18px 18px 0 0;
  }

  .drawer{
    width:420px;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .topbar{
    height:64px;
    padding:0 17px;
  }

  .topbar-title{
    font-size:24px;
  }

  .page-content{
    padding:24px 28px 35px;
  }

  .section-title{
    font-size:26px;
  }

  .tile-grid{
    grid-template-columns:repeat(3,1fr);
    gap:17px;
  }

  .tile{
    min-height:210px;
    padding:22px 6px 12px;
  }

  .tile-icon{
    width:65px;
    height:65px;
  }

  .tile-label{
    font-size:15px;
    min-width:92%;
  }

  .timetable-card{
    min-width:380px;
  }

  .profile-row{
    padding-left:36px;
    padding-right:36px;
  }

  .mess-card{
    padding:30px 36px;
  }

  .mess-photo{
    width:225px;
    height:225px;
  }

  .mess-instruction{
    font-size:26px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }
}

@media(max-width:380px){

  .page-content{
    padding-left:18px;
    padding-right:18px;
  }

  .tile-grid{
    gap:12px;
  }

  .tile{
    min-height:190px;
  }

  .tile-icon{
    width:55px;
    height:55px;
  }

  .tile-label{
    font-size:13px;
  }

  .timetable-card{
    min-width:310px;
  }

  .profile-row{
    padding-left:25px;
    padding-right:25px;
  }

  .profile-photo,
  .mess-photo{
    width:190px;
    height:190px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<!-- =========================
     MODALS
========================= -->

<div class="modal" id="modal">
  <div class="modal-box" id="modalContent"></div>
</div>

<script>

/* =====================================================
   ICONS
===================================================== */

const icons = {

menu:`<svg class="icon" viewBox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16"/>
</svg>`,

/* =====================================================

function saveProfile(){
  localStorage.setItem("studentProfile",JSON.stringify(profile));
}

function saveTiles(){
  localStorage.setItem("dashboardTiles",JSON.stringify(tiles));
}

function saveHistory(){
  localStorage.setItem("mealHistory",JSON.stringify(mealHistory));
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function photo(){
  return profile?.photo || "";
}

function displayPhoto(className="profile-photo"){
  if(photo()){
    return `<img class="${className}" src="${photo()}" alt="Profile">`;
  }

  return `
    <div class="${className}" style="
      background:#eee;
      display:grid;
      place-items:center;
      color:#888;
      font-size:14px;
    ">PHOTO</div>
  `;
}

function getTile(id){
  return defaultTiles.find(t=>t.id===id);

        onclick="${action}"

        ${tile.name}

}

/* =====================================================
   TILE MANAGEMENT
===================================================== */

function removeTile(id){

  tiles=tiles.filter(x=>x!==id);
  saveTiles();
  dashboard();

}

function addTile(id){

  if(!tiles.includes(id)){
    tiles.push(id);
    saveTiles();
  }

  dashboard();
}

function showAddTiles(){

  const menu=document.getElementById("addTileMenu");

  if(!menu) return;

  if(!menu.classList.contains("hidden")){
    menu.classList.add("hidden");
    return;
  }

  const available=defaultTiles.filter(
    x=>!tiles.includes(x.id)
  );

  menu.innerHTML=available.length
    ? available.map(x=>`
      <button
        class="add-chip"
        onclick="addTile('${x.id}')"
      >+ ${x.name}</button>
    `).join("")
    : `<span style="color:#777">All tiles are visible.</span>`;

  menu.classList.remove("hidden");
}

function openDrawer(){

  document.getElementById("drawer")?.classList.add("open");
  document.getElementById("drawerOverlay")?.classList.add("open");

}

function closeDrawer(){

  document.getElementById("drawer")?.classList.remove("open");
  document.getElementById("drawerOverlay")?.classList.remove("open");

}

function filterDrawer(value){

  const q=value.toLowerCase().trim();

  document.querySelectorAll(".drawer-search-item")
    .forEach(item=>{

      item.style.display =
        !q || item.dataset.search.includes(q)
          ? "flex"
          : "none";

    });

}

===================================================== */

function scanMeal(meal){

  openModal(`

    <h2 class="modal-title">
      ${meal} Scanner
    </h2>

    <p style="text-align:center">
      Scan the mess QR code to avail your meal.
    </p>

    <div class="scanner">

      <div class="qr-pattern" id="qrPattern"></div>

    </div>

    <p style="text-align:center">
      ${esc(profile.name)}<br>
      ${esc(profile.registration)}
    </p>

    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        onclick="simulateMeal('${meal}')"
      >
        Simulate Scan
      </button>

    </div>

  `);

  generateQR();

}

function generateQR(){

  const box=document.getElementById("qrPattern");

  if(!box) return;

  box.innerHTML="";

  for(let i=0;i<225;i++){

    const cell=document.createElement("div");

    if(
      Math.random()>.58 ||
      i<45 ||
      (i%15<3) ||
      (i%15>11)
    ){
      cell.style.background="#222";
    }

    cell.className="qr-cell";

    box.appendChild(cell);
  }

}

function simulateMeal(meal){

  const now=new Date();

  mealHistory.push({

    meal,

    date:now.toLocaleDateString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ),

    time:now.toLocaleTimeString(
      "en-IN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    ),

    status:"Availed"

  });

  saveHistory();

  openModal(`

    <div style="
      text-align:center;
      padding:20px;
    ">

      <div style="
        width:75px;
        height:75px;
        border-radius:50%;

        Meal Availed Successfully
      </h2>

      <p>
        ${meal} has been added to your meal history.
      </p>

      <button
        class="primary-btn"
        style="width:100%"
        onclick="closeModal()"

    </div>

  `);

}

}

function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

}

document.getElementById("modal").addEventListener(
  "click",
  function(e){

    if(e.target===this){
      closeModal();
    }

  }
);


/* =====================================================
   QR MODAL
===================================================== */

function qrModal(){

  openModal(`

    <h2 class="modal-title">
      Student QR
    </h2>

    <div class="qr-pattern" id="profileQR"></div>

    <p style="text-align:center">
      <strong>${esc(profile.name)}</strong><br>
      ${esc(profile.registration)}<br>
      ${esc(profile.program)}
    </p>

    <button
      class="primary-btn"
      style="width:100%"
      onclick="closeModal()"
    >
      Close
    </button>

  `);

  generateProfileQR();

}

function generateProfileQR(){

  const box=document.getElementById("profileQR");

  if(!box)return;

  box.innerHTML="";

  let seed=
    profile.name+
    profile.registration+
    profile.program;

  let n=0;

  for(const c of seed){
    n+=c.charCodeAt(0);
  }

  for(let i=0;i<225;i++){

    const cell=document.createElement("div");

    const val=(i*n+i*i+n)%11;

    if(val<5){
      cell.style.background="#222";
    }

    cell.className="qr-cell";

    box.appendChild(cell);
  }

}
